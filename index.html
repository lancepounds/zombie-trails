<title>Zombie Trails</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* ZOMBIE TRAILS — black ink on paper, like a classic monochrome computer.
   The interface, atlas, and pixel art share these neutral tones. Emphasis is
   inverse video, sharp frames, and stippling rather than colored accents. */

:root {
  /* Legacy token names: ink is the paper surface; phos is the printed ink. */
  --ink: #e8e8e8;
  --ink-2: #d8d8d8;
  --phos: #181818;
  --phos-dim: #505050;
  --phos-dimmer: #686868;
  --phos-faint: #b0b0b0;
  --tscale: 1;
  --gap: 14px;
  --fs: calc(1rem * var(--tscale));
  color-scheme: light;
}

* { box-sizing: border-box; }
::selection { background: var(--phos); color: var(--ink); }

body {
  margin: 0;
  background: var(--ink-2);
  background-image: radial-gradient(var(--phos-dimmer) .65px, transparent .65px);
  background-size: 4px 4px;
  color: var(--phos);
  font-family: 'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace;
  font-size: var(--fs);
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  padding: clamp(8px, 2vw, 26px);
  min-height: 100vh;
}

/* ---------- the monochrome window ---------- */
.tube {
  max-width: 1120px;
  margin: 0 auto;
  background: var(--ink);
  border: 4px double var(--phos);
  padding: clamp(10px, 2vw, 22px);
  position: relative;
}
.tube::after { /* a stippled frame, clear of all text and controls */
  content: '';
  position: absolute; inset: 5px;
  pointer-events: none;
  border: 1px dotted var(--phos-faint);
}
.tube.reduced::after { display: none; }

.brand {
  display: flex; justify-content: space-between; align-items: baseline;
  gap: 12px; flex-wrap: wrap;
  font-family: 'Silkscreen', 'IBM Plex Mono', monospace;
  font-size: calc(11px * var(--tscale));
  letter-spacing: 0.14em;
  color: var(--phos-dimmer);
  border-bottom: 1px solid var(--phos-faint);
  padding-bottom: 8px; margin-bottom: var(--gap);
  text-transform: uppercase;
}
.theme-toggle { font: inherit; color: var(--phos); background: var(--ink); border: 1px solid var(--phos-dim); padding: 8px 12px; min-height: 44px; cursor: pointer; }
.theme-toggle:hover { background: var(--phos); color: var(--ink); }
.theme-toggle:focus-visible { outline: 3px double var(--phos); outline-offset: 3px; }
.party-count { display: flex; align-items: center; flex-wrap: wrap; gap: 12px; margin: 18px 0; }
.party-count select { min-height: 44px; }
.traveler-list { display: grid; gap: 14px; }
.traveler-card { border: 1px solid var(--phos-dim); margin: 0; padding: 12px; min-width: 0; }
.traveler-card legend { padding: 0 8px; font-weight: bold; }
.traveler-fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 210px), 1fr)); gap: 16px; }
.traveler-fields label { display: block; font-weight: bold; }
.traveler-fields input, .traveler-fields select { display: block; margin: 5px 0; min-height: 44px; max-width: none; }
.traveler-fields small { display: block; font-size: calc(13px * var(--tscale)); font-weight: normal; color: var(--phos-dim); }
.party-effects { border: 1px solid var(--phos-faint); padding: 10px; margin: 12px 0; }
.party-effects summary { cursor: pointer; min-height: 32px; font-weight: bold; }
.party-effects summary:focus-visible { outline: 2px solid var(--phos); outline-offset: 2px; }
.party-effects ul { margin-top: 12px; }
.party-effects li { margin-bottom: 10px; }
.scene-hint { color: var(--phos-dim); border-top: 1px dotted var(--phos-dim); padding-top: 12px; }

/* ---------- typography ---------- */
h1, h2, h3 {
  font-family: 'Silkscreen', 'IBM Plex Mono', monospace;
  font-weight: 400;
  letter-spacing: 0.06em;
  text-wrap: balance;
  margin: 0 0 10px;
}
h1 { font-size: calc(19px * var(--tscale)); }
h2 { font-size: calc(13px * var(--tscale)); color: var(--phos-dim); margin-top: 18px; text-transform: uppercase; letter-spacing: 0.12em; }
h3 { font-size: calc(11px * var(--tscale)); color: var(--phos-dim); text-transform: uppercase; letter-spacing: 0.12em; margin: 0 0 6px; }
p { margin: 0 0 10px; max-width: 68ch; }
b, strong { font-weight: 700; }
.dim { color: var(--phos-dim); }
.small { font-size: calc(12px * var(--tscale)); }
.lede { color: var(--phos-dim); max-width: 72ch; }
.foot { color: var(--phos-dimmer); font-size: calc(12px * var(--tscale)); margin-top: 12px; }
.warn { color: var(--phos); background: var(--phos-faint); padding: 0 4px; }

/* ---------- status bar: inverse video ---------- */
.bar {
  display: flex; flex-wrap: wrap; gap: 0;
  background: var(--phos); color: var(--ink);
  font-size: calc(12px * var(--tscale));
  letter-spacing: 0.04em;
  margin-bottom: var(--gap);
}
.bar span { padding: 4px 10px; border-right: 2px solid var(--ink); white-space: nowrap; }
.bar span:last-child { border-right: 0; }
.bar b { font-weight: 700; margin-right: 6px; }

/* ---------- scene ----------
   The picture is a framed window, shrink-wrapped to the canvas. */
.scene { display: flex; justify-content: center; margin-bottom: var(--gap); line-height: 0; }
.scene canvas {
  display: block; max-width: 100%; image-rendering: pixelated;
  background: var(--ink); border: 3px double var(--phos);
}

/* ---------- menus ---------- */
.menu { list-style: none; margin: var(--gap) 0 0; padding: 0; display: flex; flex-direction: column; gap: 3px; }
.menu.compact { margin-top: 0; }
.road-note { border-left: 2px solid var(--phos-dim); padding: 6px 10px; margin-bottom: 12px; }
.road-note p { margin-bottom: 4px; }
@media (prefers-reduced-motion: reduce) { .tube::after { display: none; } }
.menu .sep { color: var(--phos-dimmer); font-size: calc(11px * var(--tscale)); text-transform: uppercase; letter-spacing: 0.12em; padding: 10px 0 2px; }
button.cmd {
  min-height: 44px;
  display: flex; align-items: baseline; gap: 10px; width: 100%;
  background: transparent; color: var(--phos);
  border: 1px solid transparent;
  font: inherit; text-align: left; cursor: pointer;
  padding: 5px 8px 5px 4px;
}
button.cmd .num {
  flex: none; width: 1.7em; text-align: center;
  background: var(--phos-faint); color: var(--phos);
  font-family: 'Silkscreen', monospace; font-size: calc(11px * var(--tscale));
  padding: 2px 0;
}
button.cmd .lbl { flex: 1 1 auto; }
button.cmd .lbl { white-space: normal; }
button.cmd .hint {
  flex: 0 1 46%; color: var(--phos-dim); font-size: calc(14px * var(--tscale));
  text-align: right; white-space: normal; max-width: 46%; overflow-wrap: anywhere;
}
button.cmd:hover:not(:disabled), button.cmd:focus-visible {
  background: var(--phos); color: var(--ink); outline: none;
}
button.cmd:hover:not(:disabled) .num, button.cmd:focus-visible .num { background: var(--ink); color: var(--phos); }
button.cmd:hover:not(:disabled) .hint, button.cmd:focus-visible .hint { color: var(--ink); }
button.cmd:disabled { color: var(--phos-dimmer); cursor: default; }
button.cmd:disabled .num { background: transparent; border: 1px solid var(--phos-faint); color: var(--phos-dimmer); }

/* ---------- title ---------- */
.title-wrap { text-align: left; }
.logo {
  font-family: 'IBM Plex Mono', monospace;
  font-size: clamp(4px, 1.32vw, 11px);
  line-height: 1.05;
  margin: 0 0 6px;
  color: var(--phos);
  overflow-x: auto;
  white-space: pre;
}
.tag {
  font-family: 'Silkscreen', monospace;
  letter-spacing: 0.3em; color: var(--phos-dim);
  font-size: calc(11px * var(--tscale)); margin-bottom: var(--gap);
}
.blurb { color: var(--phos-dim); margin: var(--gap) 0 0; }

/* ---------- documents ---------- */
.doc { max-width: 100%; }
.cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 8px 34px; }
.cols section.wide { grid-column: 1 / -1; }
ul.plain, ol.plain { margin: 0 0 10px; padding-left: 1.3em; }
ul.plain li, ol.plain li { margin-bottom: 3px; }
.doc ul { max-width: 68ch; }

/* ---------- tables ---------- */
table { border-collapse: collapse; width: 100%; font-size: calc(13px * var(--tscale)); margin-bottom: 10px; }
caption { text-align: left; font-family: 'Silkscreen', monospace; font-size: calc(11px * var(--tscale)); color: var(--phos-dim); text-transform: uppercase; letter-spacing: 0.12em; padding-bottom: 5px; }
th, td { text-align: left; padding: 3px 8px 3px 0; vertical-align: top; }
thead th { color: var(--phos-dim); font-weight: 400; font-size: calc(11px * var(--tscale)); text-transform: uppercase; letter-spacing: 0.1em; border-bottom: 1px solid var(--phos-faint); }
tfoot th, tfoot td { border-top: 1px solid var(--phos-faint); padding-top: 6px; }
tbody tr + tr th, tbody tr + tr td { border-top: 1px solid var(--phos-faint); }
.num, .r { text-align: right; font-variant-numeric: tabular-nums; }
td.r, th.r { text-align: right; }
tr.dead th, tr.dead td { color: var(--phos-dimmer); text-decoration: line-through; text-decoration-thickness: 1px; }
tr.dead td { text-decoration: none; }
.small-table { max-width: 420px; }

/* meters: a bar plus the number, never the bar alone */
td.meter { position: relative; min-width: 96px; }
td.meter span { display: inline-block; height: 8px; background: var(--phos-dim); vertical-align: middle; max-width: 74px; }
td.meter b { font-weight: 400; margin-left: 8px; font-variant-numeric: tabular-nums; color: var(--phos-dim); }

.cond { text-transform: uppercase; font-size: calc(11px * var(--tscale)); letter-spacing: 0.08em; }
.cond.bad { background: var(--phos); color: var(--ink); padding: 0 5px; }
.cond.mid { border-bottom: 1px solid var(--phos-dim); }
.cond.dead, .cond.ok { color: var(--phos-dim); }

/* ---------- travel screen ---------- */
.travel { display: grid; grid-template-columns: minmax(300px, 1.15fr) minmax(280px, 1fr); gap: 10px 34px; align-items: start; }
.warnings { list-style: none; margin: 0 0 10px; padding: 6px 10px; border: 1px solid var(--phos-dim); }
.warnings li { padding: 1px 0; }
.warnings li::before { content: '! '; font-weight: 700; }
table.party th[scope=row] { font-weight: 400; }
table.party .role { display: block; color: var(--phos-dimmer); font-size: calc(11px * var(--tscale)); text-transform: uppercase; letter-spacing: 0.08em; }
.supplies { margin-top: 16px; }
.supplies .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(112px, 1fr)); gap: 5px 14px; }
.supplies .grid div { border-left: 1px solid var(--phos-faint); padding-left: 8px; }
.supplies b { display: block; font-variant-numeric: tabular-nums; }
.supplies span { color: var(--phos-dimmer); font-size: calc(11px * var(--tscale)); }

.travelling .ticker { color: var(--phos-dim); min-height: 3em; }

/* ---------- events ---------- */
.event .mtitle { font-size: calc(15px * var(--tscale)); letter-spacing: 0.14em; margin-bottom: 10px; }
.etext { border-left: 2px solid var(--phos); padding-left: 14px; margin-bottom: 4px; }
.etext p { font-size: calc(16px * var(--tscale)); max-width: 66ch; margin: 0; }
.deltas { list-style: none; display: flex; flex-wrap: wrap; gap: 4px 6px; margin: 14px 0 0; padding: 0; }
.deltas li {
  border: 1px solid var(--phos-dimmer); color: var(--phos-dim);
  padding: 1px 7px; font-size: calc(12px * var(--tscale)); letter-spacing: 0.04em;
}
.deltas li:first-letter { font-weight: 700; }

/* ---------- setup and shop ---------- */
input, select {
  background: var(--ink-2); color: var(--phos); border: 1px solid var(--phos-dimmer);
  font: inherit; font-size: calc(13px * var(--tscale)); padding: 3px 6px; width: 100%; max-width: 190px;
}
input:focus, select:focus { outline: 2px solid var(--phos); outline-offset: 1px; }
input::placeholder { color: var(--phos-dim); opacity: 1; }
.party-setup td { padding: 4px 10px 4px 0; }
.diffs { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 8px; margin-bottom: 8px; }
button.diff {
  background: transparent; border: 1px solid var(--phos-faint); color: var(--phos);
  font: inherit; text-align: left; padding: 8px 10px; cursor: pointer; display: block;
}
button.diff b { display: block; font-family: 'Silkscreen', monospace; font-size: calc(12px * var(--tscale)); letter-spacing: 0.08em; }
button.diff span { display: block; color: var(--phos-dim); font-size: calc(12px * var(--tscale)); margin-top: 4px; }
button.diff.on { background: var(--phos); color: var(--ink); border-color: var(--phos); }
button.diff.on span { color: var(--ink); }
button.diff:focus-visible { outline: 2px solid var(--phos); outline-offset: 2px; }
.shop-table td.qty { white-space: nowrap; }
button.q {
  background: transparent; border: 1px solid var(--phos-dimmer); color: var(--phos);
  font: inherit; width: 26px; height: 22px; cursor: pointer; margin-right: 3px; line-height: 1;
}
button.q:hover, button.q:focus-visible { background: var(--phos); color: var(--ink); outline: none; }

/* ---------- map ---------- */
.routebar { position: relative; height: 20px; border: 1px solid var(--phos-dimmer); margin: 6px 0 18px; }
.routebar .fill { position: absolute; inset: 0 auto 0 0; background: var(--phos-faint); }
.routebar i { position: absolute; top: -1px; bottom: -1px; width: 1px; background: var(--phos-dim); }
.routebar .you { position: absolute; top: 15px; transform: translateX(-50%); font-style: normal; font-size: 12px; }
tr.done th, tr.done td { color: var(--phos-dimmer); }
tr.here th { background: var(--phos); color: var(--ink); }

/* ---------- memorial ---------- */
.memorial { text-align: center; padding: 10px 0 4px; }
.mem-here { font-family: 'Silkscreen', monospace; letter-spacing: 0.4em; color: var(--phos-dim); font-size: calc(11px * var(--tscale)); }
.mem-name { font-family: 'Silkscreen', monospace; font-size: calc(26px * var(--tscale)); letter-spacing: 0.1em; margin: 6px 0; }
.mem-meta { color: var(--phos-dim); letter-spacing: 0.1em; font-size: calc(12px * var(--tscale)); }
.mem-label { display: block; color: var(--phos-dim); font-size: calc(12px * var(--tscale)); margin: 18px 0 5px; }
.memorial input { max-width: 340px; margin: 0 auto; text-align: center; }
.memorial .menu { align-items: center; margin-top: 16px; }
.memorial button.cmd { width: auto; }

/* ---------- journal ---------- */
ul.log { list-style: none; margin: 0; padding: 0; font-size: calc(13px * var(--tscale)); }
ul.log li {
  display: grid; grid-template-columns: 11em 1fr; gap: 0 12px; align-items: baseline;
  padding: 2px 0; color: var(--phos-dim); border-bottom: 1px solid var(--phos-faint);
}
ul.log li.notable { color: var(--phos); }
ul.log .when { color: var(--phos-dimmer); font-size: calc(11px * var(--tscale)); white-space: nowrap; }

/* ---------- end ---------- */
.end .rank {
  font-family: 'Silkscreen', monospace; font-size: calc(17px * var(--tscale));
  background: var(--phos); color: var(--ink); display: inline-block; padding: 3px 12px; letter-spacing: 0.14em;
}
.score tr.tot th, .score tr.tot td { border-top: 1px solid var(--phos-faint); }
.score tr.grand th, .score tr.grand td { background: var(--phos); color: var(--ink); font-weight: 700; padding: 3px 8px; }

/* ---------- scavenge ---------- */
.scav-ui { display: grid; grid-template-columns: 1fr auto; gap: 20px; align-items: start; }
.scav-ui p { max-width: 62ch; }
.pad { display: grid; justify-items: center; gap: 5px; }
.pad div { display: flex; gap: 5px; }
button.p {
  background: transparent; border: 1px solid var(--phos-dimmer); color: var(--phos);
  font: inherit; font-size: calc(12px * var(--tscale)); min-width: 62px; padding: 10px 8px; cursor: pointer;
  touch-action: none; user-select: none;
}
button.p.wide { width: 100%; margin-top: 6px; }
button.p:active, button.p:focus-visible { background: var(--phos); color: var(--ink); outline: none; }

/* ---------- responsive ---------- */
@media (max-width: 780px) {
  .travel { grid-template-columns: 1fr; }
  .scav-ui { grid-template-columns: 1fr; }
  .bar { font-size: calc(11px * var(--tscale)); }
  .bar span { padding: 3px 7px; }
  button.cmd .hint { display: none; }
  .menu.compact button.cmd .hint { display: none; }
  ul.log li { grid-template-columns: 1fr; }
}
@media (max-width: 520px) {
  .supplies .grid { grid-template-columns: repeat(2, 1fr); }
  .etext p { font-size: calc(15px * var(--tscale)); }
}

@media (prefers-reduced-motion: reduce) {
  .tube::after { display: none; }
}

/* wide content never pushes the page sideways */
.doc, .event, .travel { overflow-x: auto; }

/* ---------- scavenge HUD (in the DOM, so it is readable and announced) ---------- */
.scav-hud {
  display: flex; flex-wrap: wrap; gap: 0;
  background: var(--phos); color: var(--ink);
  font-size: calc(12px * var(--tscale)); letter-spacing: 0.04em; margin-bottom: var(--gap);
}
.scav-hud span { display: flex; align-items: center; gap: 8px; padding: 4px 12px; border-right: 2px solid var(--ink); }

/* ============================================================
   TOUCH / TABLET
   The keyboard path stays exactly as it was. Everything below
   only changes what a finger gets: bigger targets, no browser
   chrome behaviours, and a shell that fills the screen.
   ============================================================ */

html, body { height: 100%; }
html { overscroll-behavior: none; }         /* no rubber-band past the edges */
body {
  overscroll-behavior: none;
  -webkit-tap-highlight-color: transparent; /* no blue flash on tap */
  -webkit-text-size-adjust: 100%;
  padding:
    calc(clamp(8px, 2vw, 26px) + env(safe-area-inset-top))
    calc(clamp(8px, 2vw, 26px) + env(safe-area-inset-right))
    calc(clamp(8px, 2vw, 26px) + env(safe-area-inset-bottom))
    calc(clamp(8px, 2vw, 26px) + env(safe-area-inset-left));
}
/* the game chrome is not a document: nothing to select or long-press */
.tube { user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
input, textarea, .etext, ul.log, .doc p { user-select: text; -webkit-user-select: text; }
button, .place, .diff, .q, .p { touch-action: manipulation; }   /* kills the 300ms tap delay and double-tap zoom */

/* standalone (home-screen) mode: fill the display, scroll the content, not the page */
@media (display-mode: standalone), (display-mode: fullscreen) {
  body { overflow: hidden; padding-top: calc(6px + env(safe-area-inset-top)); }
  .tube { height: 100%; display: flex; flex-direction: column; max-width: 1400px; }
  #screen { flex: 1 1 auto; overflow-y: auto; -webkit-overflow-scrolling: touch; }
  .bar { position: sticky; top: 0; z-index: 5; }
}

/* ---------- coarse pointers: every target at least 48px ---------- */
@media (pointer: coarse) {
  :root { --tscale: 1.06; }
  button.cmd {
    min-height: 52px; align-items: center; padding: 10px 12px 10px 6px;
    border: 1px solid var(--phos-faint); gap: 12px;
  }
  button.cmd:active:not(:disabled) { background: var(--phos); color: var(--ink); }
  button.cmd:active:not(:disabled) .num { background: var(--ink); color: var(--phos); }
  button.cmd:active:not(:disabled) .hint { color: var(--ink); }
  button.cmd .num { padding: 5px 0; width: 2em; }
  .menu { gap: 6px; }
  button.cmd .hint { display: block; max-width: 40%; }

  button.q { width: 52px; height: 46px; font-size: calc(17px * var(--tscale)); }
  button.q:active { background: var(--phos); color: var(--ink); }
  .shop-table td, .shop-table th { padding: 8px 8px 8px 0; }
  button.diff { padding: 14px 14px 16px; }
  button.place { min-height: 44px; padding: 8px 8px; align-items: center; }
  button.place:active { background: var(--phos); color: var(--ink); }
  input, select { min-height: 46px; font-size: 16px; }      /* 16px stops iOS zooming the field */
  .party-setup td { padding: 6px 10px 6px 0; }
  .bar span { padding: 7px 11px; }
  ul.places { gap: 2px; }
}

/* ---------- iPad portrait: one column, wider reading measure ---------- */
@media (pointer: coarse) and (max-width: 1024px) {
  .travel { grid-template-columns: 1fr; gap: 18px; }
  .cols { grid-template-columns: 1fr; }
  .mapwrap { grid-template-columns: 1fr; }
  .scav-ui { grid-template-columns: 1fr; }
  .supplies .grid { grid-template-columns: repeat(3, 1fr); }
}

/* ---------- the scavenging run on a touch screen ----------
   No d-pad. Put a finger down anywhere on the left of the play area and it
   becomes a thumbstick where you put it; the right side is one big SEARCH. */
.touchpad { display: none; }
@media (pointer: coarse) {
  .pad { display: none; }
  .touchpad { display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: stretch; margin-top: 10px; }
  .stickzone {
    border: 1px dashed var(--phos-dimmer); color: var(--phos-dimmer);
    display: flex; align-items: center; justify-content: center; text-align: center;
    min-height: 96px; padding: 10px; font-size: calc(12px * var(--tscale)); letter-spacing: 0.08em;
  }
  .stickzone.live { border-style: solid; border-color: var(--phos); color: var(--phos); }
  .touchbtns { display: flex; flex-direction: column; gap: 8px; }
  button.big {
    background: transparent; border: 1px solid var(--phos-dim); color: var(--phos);
    font: inherit; font-family: 'Silkscreen', monospace; letter-spacing: 0.1em;
    font-size: calc(13px * var(--tscale)); min-width: 132px; min-height: 62px; padding: 10px 16px; cursor: pointer;
  }
  button.big:active { background: var(--phos); color: var(--ink); }
  button.big.ghost { border-color: var(--phos-faint); color: var(--phos-dim); min-height: 46px; }
}

/* the canvas itself is a control surface during a scavenging run */
.scav .scene { touch-action: none; }

ZT.rand = function (s) {
  s.rng = (s.rng + 0x6D2B79F5) | 0;
  let t = s.rng;
  t = Math.imul(t ^ (t >>> 15), t | 1);
  t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
};

ZT.rint = (s, a, b) => a + Math.floor(ZT.rand(s) * (b - a + 1));

/* ---------- graph helpers ---------- */
ZT.legsFrom = (id) => ZT.LEGS.filter((l) => l.from === id);
ZT.legBetween = (a, b) => ZT.LEGS.find((l) => l.from === a && l.to === b) || null;

/* shortest remaining distance to Boise from a node (Dijkstra on a tiny DAG) */
ZT.distToEnd = (function () {
  const memo = {};
  return function dist(id) {
    if (id === ZT.END_NODE) return 0;
    if (memo[id] != null) return memo[id];
    memo[id] = Infinity;                       // guards a cycle; the graph has none
    let best = Infinity;
    for (const l of ZT.legsFrom(id)) best = Math.min(best, l.miles + dist(l.to));
    memo[id] = best;
    return best;
  };
})();
/* the longest a run can be, for the progress bar's outer bound */
ZT.LONGEST = (function () {
  const memo = {};
  function far(id) {
    if (id === ZT.END_NODE) return 0;
    if (memo[id] != null) return memo[id];
    let best = 0;
    for (const l of ZT.legsFrom(id)) best = Math.max(best, l.miles + far(l.to));
    memo[id] = best;
    return best;
  }
  return far(ZT.START_NODE);
})();
ZT.SHORTEST = ZT.distToEnd(ZT.START_NODE);

/* how far along the whole journey the player is, 0..1 — by distance still to run,
   so taking the long way does not make the bar go backwards */
ZT.progress = function (s) {
  const remain = ZT.milesToEnd(s);
  return ZT.clamp(1 - remain / ZT.SHORTEST, 0, 1);
};
ZT.milesToEnd = function (s) {
  const leg = ZT.currentLeg(s);
  if (!leg) return ZT.distToEnd(s.at);
  return (leg.miles - s.legMiles) + ZT.distToEnd(leg.to);
};
ZT.currentLeg = (s) => (s.legTo ? ZT.legBetween(s.at, s.legTo) : null);
ZT.regionId = (s) => { const l = ZT.currentLeg(s); return l ? l.region : (ZT.NODES[s.at].kind === 'end' ? 'owyhee' : 'missouri'); };
ZT.region = (s) => ZT.REGIONS[ZT.regionId(s)];

/* can you still get from a to b by any road? */
ZT.reachable = function (from, target) {
  if (from === target) return true;
  const seen = {}, stack = [from];
  while (stack.length) {
    const id = stack.pop();
    if (seen[id]) continue;
    seen[id] = true;
    for (const l of ZT.legsFrom(id)) { if (l.to === target) return true; stack.push(l.to); }
  }
  return false;
};

/* the node the player is driving toward, for the status bar */
ZT.nextNode = function (s) {
  const l = ZT.currentLeg(s);
  return ZT.NODES[l ? l.to : s.at];
};
ZT.milesToNext = function (s) {
  const l = ZT.currentLeg(s);
  return l ? Math.max(0, Math.round(l.miles - s.legMiles)) : 0;
};

/* interpolated position (lat/lon) along the current leg — the map marker */
ZT.position = function (s) {
  const l = ZT.currentLeg(s);
  const a = ZT.NODES[s.at];
  if (!l) return { lat: a.lat, lon: a.lon };
  const b = ZT.NODES[l.to];
  const t = ZT.clamp(s.legMiles / l.miles, 0, 1);
  return { lat: a.lat + (b.lat - a.lat) * t, lon: a.lon + (b.lon - a.lon) * t };
};

/* compass bearing of travel, for the map's sense of direction */
ZT.heading = function (s) {
  const l = ZT.currentLeg(s);
  if (!l) return 'W';
  const a = ZT.NODES[s.at], b = ZT.NODES[l.to];
  const dx = (b.lon - a.lon) * Math.cos((a.lat * Math.PI) / 180);
  const dy = b.lat - a.lat;
  const deg = (Math.atan2(dx, dy) * 180) / Math.PI;
  const dirs = ['N', 'NE', 'E', 'SE', 'S', 'SW', 'W', 'NW'];
  return dirs[Math.round(((deg + 360) % 360) / 45) % 8];
};

/* ZOMBIE TRAILS — game state */
'use strict';
ZT.State = {
  newMember(name, role, trait) {
    return {
      name, role, trait: Object.hasOwn(ZT.TRAITS, trait) ? trait : 'steady',
      health: 100, fatigue: 0, morale: 75,
      injury: 0, illness: 0,
      inf: 'none', infSev: 0, infDays: 0, infStable: false,
      isolated: false,
      alive: true, cause: '', diedDay: 0, diedMile: 0, epitaph: '',
      missing: false,
    };
  },

  newGame(opts) {
    const diff = ZT.DIFF[opts.difficulty] ? opts.difficulty : 'normal';
    const seed = (opts.seed == null ? Math.floor(Math.random() * 2 ** 31) : opts.seed) | 0;
    const s = {
      v: ZT.SAVE_VERSION, seed, rng: seed,
      difficulty: diff,
      day: 1, miles: 0,
      at: ZT.START_NODE, legTo: null, legMiles: 0, path: [ZT.START_NODE], seen: { omaha: true },
      pace: 'steady', rations: 'normal',
      weather: 'clear', weatherDays: 0,
      party: [], inv: { food: 0, fuel: 0, medicine: 0, ammo: 0, parts: 0, tools: 0, goods: 0, cash: ZT.DIFF[diff].cash },
      vehicle: { has: true, engine: 88, tires: 82, electrical: 85, body: 90, broken: null, name: 'station wagon' },
      zombie: { noise: 0, horde: 5 },
      flags: {},
      log: [], stats: { travelDays: 0, restDays: 0, scavenges: 0, shots: 0, events: 0, deaths: 0, breakdowns: 0, bites: 0, kills: 0, eventsSeen: {}, choices: {} },
      recent: [], once: {},
      scavAt: {},
      pendingDeaths: [],
      partialDelay: 0,
      lastEventDay: 0,
      over: null, departed: false,
      markerSeen: {},
    };
    const names = opts.names || ZT.DEFAULT_NAMES;
    const roles = opts.roles || ['driver', 'medic', 'mechanic', 'scout', 'generalist'];
    const count = Number.isFinite(opts.partySize) ? ZT.clamp(Math.floor(opts.partySize), 1, ZT.MAX_PARTY) : ZT.MAX_PARTY;
    const traits = opts.traits || ZT.DEFAULT_TRAITS;
    for (let i = 0; i < count; i++) s.party.push(ZT.State.newMember(String(names[i] || ZT.DEFAULT_NAMES[i]).trim().slice(0, 12) || ZT.DEFAULT_NAMES[i], ZT.ROLES.includes(roles[i]) ? roles[i] : 'generalist', traits[i]));
    ZT.State.log(s, 'The Omaha gate closes behind you. Boise is 1,300 miles west, give or take.', true);
    return s;
  },

  log(s, text, notable) {
    s.log.push({ day: s.day, mile: Math.round(s.miles), text, n: !!notable });
    if (s.log.length > 400) s.log.splice(0, s.log.length - 400);
  },

  alive: (s) => s.party.filter((m) => m.alive && !m.missing),
  aliveCount: (s) => s.party.filter((m) => m.alive && !m.missing).length,
  hasRole: (s, role) => s.party.some((m) => m.alive && !m.missing && m.role === role),
  byRole(s, role) { return s.party.find((m) => m.alive && !m.missing && m.role === role) || null; },

  /* readable condition summary */
  condition(m) {
    if (!m.alive) return 'dead';
    if (m.missing) return 'missing';
    if (m.inf === 'symptomatic' || m.health < 20) return 'critical';
    if (m.inf === 'bitten') return 'infected';
    if (m.inf === 'exposed') return 'exposed';
    if (m.injury > 30) return 'injured';
    if (m.illness > 20) return 'ill';
    if (m.health < 45) return 'weak';
    if (m.fatigue > 65 || m.health < 70) return 'worn';
    return 'healthy';
  },

  weight(s) {
    let w = 0;
    for (const k of ZT.ITEM_ORDER) w += (s.inv[k] || 0) * ZT.ITEMS[k].lbs;
    return w;
  },

  serialize: (s) => JSON.stringify(s),
  deserialize(str) {
    const s = JSON.parse(str);
    if (!s || typeof s !== 'object' || !Array.isArray(s.party)) throw new Error('bad save');
    return ZT.State.migrate(s);
  },
  migrate(s) {
    if (s.v === undefined) s.v = 1;
    // future migrations: if (s.v < 2) {...; s.v = 2;}
    s.pendingDeaths = s.pendingDeaths || [];
    s.markerSeen = s.markerSeen || {};
    s.scavAt = s.scavAt || {};
    for (const m of s.party) if (!Object.hasOwn(ZT.TRAITS, m.trait)) m.trait = 'steady';
    if (!s.at) {                     // v1 saves used a linear mile counter
      s.at = ZT.START_NODE; s.legTo = null; s.legMiles = 0;
      s.path = [ZT.START_NODE]; s.seen = { omaha: true }; s.miles = 0;
    }
    s.path = s.path || [ZT.START_NODE];
    s.seen = s.seen || { omaha: true };
    return s;
  },
};

/* ===== 20_party.js ===== */
/* ZOMBIE TRAILS — party: health, fatigue, morale, infection, death */
'use strict';
ZT.Party = {
  trait(m) { return ZT.TRAITS[m.trait] || ZT.TRAITS.steady; },
  canHelp(m) { return m.alive && !m.missing && !m.isolated && m.health >= 40 && m.fatigue < 85 && m.inf !== 'symptomatic'; },
  travelBonuses(s) {
    const helpers = ZT.State.alive(s).filter(m => ZT.Party.canHelp(m));
    const count = trait => Math.min(3, helpers.filter(m => m.trait === trait).length);
    return { mileage: 1 + count('roadwise') * 0.04, fuel: 1 - count('careful') * 0.04, noise: count('quiet') * 2 };
  },
  foodNeed(s, ration) {
    const mouths = ZT.State.alive(s).reduce((n, m) => n + (m.trait === 'light_eater' ? 0.8 : 1), 0);
    return ZT.round1(mouths * ZT.RATIONS[ration || s.rations].lbs * (s.vehicle.has ? 1 : 1.15));
  },
  contribution(s, m) {
    const trait = ZT.Party.trait(m);
    if (!m.alive || m.missing) return 'No longer traveling with the party.';
    const paused = trait.group && !ZT.Party.canHelp(m);
    return `${ZT.ROLE_TIPS[m.role] || ''} ${trait.name}: ${paused ? 'Group benefit paused until rested, well enough, and out of isolation.' : trait.tip}`;
  },
  /* Daily processing for every living member. mode: 'travel' | 'rest' | 'idle' */
  dailyTick(s, mode) {
    const diff = ZT.DIFF[s.difficulty];
    const alive = ZT.State.alive(s);
    if (!alive.length) return;
    const rat = ZT.RATIONS[s.rations];
    const wx = ZT.WEATHER[s.weather];
    const pace = ZT.PACE[s.pace];
    // food
    const need = ZT.Party.foodNeed(s);
    let starving = false;
    if (s.inv.food >= need) s.inv.food = ZT.round1(s.inv.food - need);
    else { s.inv.food = 0; starving = true; }
    // remember which supply ran dry first — the journal and the summary use it
    if (!s.flags.firstZero) for (const k of ZT.ITEM_ORDER) if ((s.inv[k] || 0) <= 0) { s.flags.firstZero = k; break; }

    for (const m of alive) {
      let heal = starving ? -6 : rat.heal;
      let fat = starving ? 5 : rat.fatigue;
      // the road itself costs something; only stopping actually mends people
      if (mode === 'rest') { heal += 4; fat -= 25; }
      else if (mode === 'idle') { heal += 1; fat -= 10; }
      else { heal -= 1; fat += pace.fatigue + wx.fatigue; if (!s.vehicle.has) { heal -= 1; fat += 6; } }
      heal += wx.health;
      if (mode === 'travel' && m.trait === 'hardy') fat -= 3;
      if (m.morale > 70) heal += 1;
      if (m.morale < 25) heal -= 1;
      if (m.morale < 12) heal -= 2;
      if (m.fatigue > 80) heal -= 2;
      if (m.fatigue > 92) heal -= 2;
      // injuries and illness — both linger longer than anyone expects
      if (m.injury > 0) {
        if (m.injury > 25) heal -= Math.ceil(m.injury / 25);
        m.injury = Math.max(0, m.injury - (mode === 'rest' ? 6 : mode === 'idle' ? 4 : 2));
      }
      if (m.illness > 0) {
        heal -= Math.ceil(m.illness / 18);
        fat += 2;
        m.illness = Math.max(0, m.illness - (mode === 'rest' ? 7 : mode === 'idle' ? 4 : 2));
      }
      // infection
      heal += ZT.Party.infectionTick(s, m, diff);
      m.health = ZT.clamp(m.health + heal, 0, 100);
      m.fatigue = ZT.clamp(m.fatigue + fat, 0, 100);
      m.morale = ZT.clamp(m.morale + rat.morale + (starving ? -3 : 0) + (m.isolated ? -1 : 0) + (mode === 'travel' && !starving && m.trait === 'steady' ? 1 : 0), 0, 100);
      if (m.health <= 0) {
        let cause = 'exhaustion';
        if (m.inf === 'symptomatic') cause = 'infection';
        else if (starving) cause = 'starvation';
        else if (m.illness > 20) cause = 'illness';
        else if (m.injury > 20) cause = 'injuries';
        else if (s.weather === 'cold' || s.weather === 'snow') cause = 'exposure';
        ZT.Party.kill(s, m, cause);
      }
    }
    if (starving) s.flags.starvedDays = (s.flags.starvedDays || 0) + 1;
    else s.flags.starvedDays = 0;
  },

  /* returns a health delta for the day */
  infectionTick(s, m, diff) {
    if (m.inf === 'none') return 0;
    m.infDays++;
    if (m.inf === 'exposed') {
      if (m.infDays >= 2) {
        if (ZT.roll(s, 0.10 * diff.infect)) { m.inf = 'bitten'; m.infSev = ZT.roll(s, 0.75) ? 1 : 2; m.infDays = 0; m.infStable = false;
          ZT.State.log(s, `${m.name}'s scratch has gone bad. It is an infection now.`, true); }
        else if (ZT.roll(s, 0.5)) { m.inf = 'none'; m.infDays = 0; ZT.State.log(s, `${m.name}'s scratch has healed clean.`); }
      }
      return 0;
    }
    if (m.inf === 'bitten') {
      if (m.infSev === 0) {
        if (m.infDays >= 3 && ZT.roll(s, 0.5)) { m.inf = 'none'; m.infDays = 0; m.infStable = false; ZT.State.log(s, `${m.name}'s bite has closed up. It was only a bite.`, true); }
        return -1;
      }
      if (m.infStable) {
        if (m.infDays >= 5 && ZT.roll(s, 0.3)) { m.inf = 'none'; m.infDays = 0; m.infStable = false; ZT.State.log(s, `${m.name} is clear of the infection. The medicine held.`, true); }
        else if (ZT.roll(s, 0.03 * diff.infect)) { m.infStable = false; ZT.State.log(s, `${m.name}'s wound has opened again. The fever is back.`); }
        return -1;
      }
      const daysNeeded = m.infSev === 2 ? 3 : 4;
      const p = m.infSev === 2 ? 0.40 : 0.17;
      if (m.infDays >= daysNeeded && ZT.roll(s, p * diff.infect)) {
        m.inf = 'symptomatic'; m.infDays = 0;
        ZT.State.log(s, `${m.name} is burning with fever and talking to people who are not there.`, true);
      }
      return -2;
    }
    if (m.inf === 'symptomatic') {
      if (m.infStable) {
        if (ZT.roll(s, 0.12)) { m.inf = 'bitten'; m.infSev = 0; m.infDays = 0; m.infStable = false; ZT.State.log(s, `${m.name}'s fever has broken.`, true); }
        return -2;
      }
      m.morale = Math.max(0, m.morale - 2);
      // an unisolated symptomatic member is a danger to the others
      if (!m.isolated && ZT.roll(s, 0.05 * diff.infect)) {
        const others = ZT.State.alive(s).filter((o) => o !== m);
        if (others.length) {
          const o = ZT.pick(s, others);
          if (o.inf === 'none') { o.inf = 'exposed'; o.infDays = 0; }
          o.injury = Math.min(100, o.injury + 10);
          ZT.State.log(s, `${m.name} lashed out in a fever and caught ${o.name} across the arm.`, true);
        }
      }
      return m.infSev === 2 ? -7 : -5;
    }
    return 0;
  },

  kill(s, m, cause) {
    if (!m.alive) return;
    m.alive = false; m.cause = cause; m.diedDay = s.day; m.diedMile = Math.round(s.miles);
    m.isolated = false;
    s.stats.deaths++;
    s.pendingDeaths.push(s.party.indexOf(m));
    ZT.State.log(s, `${m.name} died of ${cause}.`, true);
    for (const o of s.party) if (o.alive) o.morale = Math.max(0, o.morale - 15);
  },

  /* Medicine use. kind: auto based on what is wrong. Returns text. */
  treat(s, m) {
    if (!m || !m.alive) return 'There is no one to treat.';
    if (s.inv.medicine <= 0) return 'There is no medicine left.';
    const medic = ZT.State.hasRole(s, 'medic') ? 0.15 : 0;
    const diff = ZT.DIFF[s.difficulty];
    s.inv.medicine--;
    const lines = [];
    if (m.inf === 'bitten' || m.inf === 'symptomatic') {
      let p = m.inf === 'bitten' ? [1.0, 0.74, 0.46][m.infSev] : [0.9, 0.5, 0.26][m.infSev];
      if (m.inf === 'bitten' && m.infDays <= 1) p += 0.18;   // dressed while it is fresh
      p = ZT.clamp(p + medic + (s.difficulty === 'easy' ? 0.12 : 0) - (s.difficulty === 'nightmare' ? 0.1 : 0), 0.05, 1);
      if (m.infStable) { m.health = Math.min(100, m.health + 8); lines.push(`${m.name} is already stable. The extra dose eases the pain a little.`); }
      else if (ZT.roll(s, p)) { m.infStable = true; m.infDays = Math.max(m.infDays, 1); m.health = Math.min(100, m.health + 6); lines.push(`The fever eases. ${m.name}'s wound looks less angry. It may hold.`); }
      else { m.health = Math.min(100, m.health + 4); lines.push(`The medicine does not seem to take. ${m.name} is no better.`); }
    } else if (m.inf === 'exposed') {
      m.inf = 'none'; m.infDays = 0; lines.push(`${m.name}'s scratch is cleaned and dressed. It should heal clean.`);
    }
    if (m.injury > 0) { m.injury = Math.max(0, m.injury - 40); m.health = Math.min(100, m.health + 5); lines.push(`${m.name}'s injury is splinted and dressed.`); }
    if (m.illness > 0) { m.illness = Math.max(0, m.illness - 45); m.health = Math.min(100, m.health + 5); lines.push(`${m.name} keeps the medicine down. The sickness loosens its grip.`); }
    if (!lines.length) { m.health = Math.min(100, m.health + 12); m.fatigue = Math.max(0, m.fatigue - 10); lines.push(`${m.name} takes vitamins and painkillers and feels a little better. It was probably a waste.`); }
    return lines.join(' ');
  },

  /* What a member needs, for the treat menu */
  needs(m) {
    const n = [];
    if (m.inf === 'symptomatic') n.push('fever');
    else if (m.inf === 'bitten') n.push('bite');
    else if (m.inf === 'exposed') n.push('scratch');
    if (m.injury > 0) n.push('injury');
    if (m.illness > 0) n.push('illness');
    return n;
  },

  /* hint text about a bite (partial information) */
  woundHint(s, m) {
    if (m.inf !== 'bitten') return '';
    if (m.infStable) return 'The wound is dressed and quiet.';
    if (m.infDays < 1) return 'The wound is fresh. Too early to tell.';
    if (m.infSev === 0) return 'The wound is pink and clean at the edges.';
    if (m.infSev === 1) return ZT.roll(s, 0.5) ? 'The wound is swollen and hot.' : 'The wound weeps. Hard to say.';
    return 'The wound is dark at the edges and smells wrong.';
  },

  avgHealth(s) { const a = ZT.State.alive(s); return a.length ? a.reduce((t, m) => t + m.health, 0) / a.length : 0; },
  avgFatigue(s) { const a = ZT.State.alive(s); return a.length ? a.reduce((t, m) => t + m.fatigue, 0) / a.length : 0; },
  avgMorale(s) { const a = ZT.State.alive(s); return a.length ? a.reduce((t, m) => t + m.morale, 0) / a.length : 0; },
};

/* ===== 25_effects.js ===== */
/* ZOMBIE TRAILS — outcome helpers used by event content.
   Every helper records a short delta string on c.d (the event context) so the
   player sees a plain summary line under the narrative text. */
'use strict';
ZT.X = {
  d(c, str) { if (c && c.d) c.d.push(str); },
  unit(item, n) {
    const it = ZT.ITEMS[item];
    if (item === 'cash') return ZT.money(n);
    return `${ZT.n(n)} ${it.unit} ${it.name.toLowerCase()}`;
  },
  /* remove up to n of an item; returns amount actually removed */
  take(s, c, item, n) {
    n = Math.max(0, Math.round(n * 10) / 10);
    const have = s.inv[item] || 0;
    const got = Math.min(have, n);
    s.inv[item] = ZT.round1(have - got);
    if (got > 0) ZT.X.d(c, '-' + ZT.X.unit(item, got));
    return got;
  },
  /* add up to cap; returns amount actually added */
  give(s, c, item, n) {
    n = Math.max(0, Math.round(n * 10) / 10);
    if (item === 'cash') { s.inv.cash += n; ZT.X.d(c, '+' + ZT.money(n)); return n; }
    const cap = ZT.ITEMS[item].cap * (s.vehicle.has ? 1 : ZT.X.footCap(item));
    const have = s.inv[item] || 0;
    const got = Math.max(0, Math.min(cap - have, n));
    s.inv[item] = ZT.round1(have + got);
    if (got > 0) ZT.X.d(c, '+' + ZT.X.unit(item, got));
    if (got < n) ZT.X.d(c, `(no room for the rest)`);
    return got;
  },
  footCap: (item) => ({ food: 0.15, fuel: 0.1, medicine: 0.5, ammo: 0.5, parts: 0.34, tools: 0.34, goods: 0.3 }[item] || 0.3),
  /* immediate health damage */
  hurt(s, c, m, amount, cause) {
    if (!m || !m.alive) return;
    m.health = ZT.clamp(m.health - amount, 0, 100);
    ZT.X.d(c, `${m.name} -${Math.round(amount)} health`);
    if (m.health <= 0) ZT.Party.kill(s, m, cause || 'injuries');
  },
  heal(s, c, m, amount) { if (!m || !m.alive) return; m.health = ZT.clamp(m.health + amount, 0, 100); ZT.X.d(c, `${m.name} +${Math.round(amount)} health`); },
  injure(s, c, m, sev, cause) {
    if (!m || !m.alive) return;
    m.injury = ZT.clamp(m.injury + sev, 0, 100);
    ZT.X.d(c, `${m.name} injured`);
    if (sev >= 40) ZT.X.hurt(s, c, m, Math.round(sev / 2), cause || 'injuries');
  },
  sicken(s, c, m, sev) { if (!m || !m.alive) return; m.illness = ZT.clamp(m.illness + sev, 0, 100); ZT.X.d(c, `${m.name} ill`); },
  bite(s, c, m) {
    if (!m || !m.alive) return;
    const diff = ZT.DIFF[s.difficulty];
    s.stats.bites++;
    if (m.inf === 'symptomatic') { ZT.X.hurt(s, c, m, 10, 'infection'); return; }
    m.inf = 'bitten'; m.infDays = 0; m.infStable = false;
    const r = ZT.rand(s) * diff.infect;
    m.infSev = r < 0.62 ? 0 : r < 0.88 ? 1 : 2;
    m.health = Math.max(1, m.health - 8);
    ZT.X.d(c, `${m.name} BITTEN`);
    ZT.State.log(s, `${m.name} was bitten.`, true);
  },
  expose(s, c, m) {
    if (!m || !m.alive || m.inf !== 'none') return;
    m.inf = 'exposed'; m.infDays = 0;
    ZT.X.d(c, `${m.name} scratched`);
  },
  fatigue(s, c, m, n) { if (!m || !m.alive) return; m.fatigue = ZT.clamp(m.fatigue + n, 0, 100); },
  fatigueAll(s, c, n) { for (const m of ZT.State.alive(s)) m.fatigue = ZT.clamp(m.fatigue + n, 0, 100); ZT.X.d(c, `party ${n > 0 ? '+' : ''}${n} fatigue`); },
  morale(s, c, n) { for (const m of ZT.State.alive(s)) m.morale = ZT.clamp(m.morale + n, 0, 100); ZT.X.d(c, `morale ${n > 0 ? '+' : ''}${n}`); },
  moraleM(s, c, m, n) { if (!m || !m.alive) return; m.morale = ZT.clamp(m.morale + n, 0, 100); ZT.X.d(c, `${m.name} morale ${n > 0 ? '+' : ''}${n}`); },
  noise(s, c, n) { s.zombie.noise = ZT.clamp(s.zombie.noise + n, 0, 100); if (n > 0) ZT.X.d(c, `noise +${n}`); },
  horde(s, c, n) { s.zombie.horde = ZT.clamp(s.zombie.horde + n, 0, 100); ZT.X.d(c, `horde pressure ${n > 0 ? '+' : ''}${n}`); },
  wear(s, c, sub, n) {
    if (!s.vehicle.has) return;
    s.vehicle[sub] = ZT.clamp(s.vehicle[sub] - n, 0, 100);
    ZT.X.d(c, `${sub} -${n}`);
  },
  repair(s, c, sub, n) { if (!s.vehicle.has) return; s.vehicle[sub] = ZT.clamp(s.vehicle[sub] + n, 0, 100); ZT.X.d(c, `${sub} +${n}`); },
  breakdown(s, c, sub) {
    if (!s.vehicle.has) return;
    s.vehicle.broken = sub; s.stats.breakdowns++;
    ZT.X.d(c, `${sub.toUpperCase()} FAILED`);
  },
  loseVehicle(s, c, why) {
    if (!s.vehicle.has) return;
    s.vehicle.has = false; s.vehicle.broken = null;
    // what can be carried on foot
    for (const k of ZT.ITEM_ORDER) {
      const cap = Math.floor(ZT.ITEMS[k].cap * ZT.X.footCap(k));
      if (s.inv[k] > cap) { ZT.X.d(c, `left behind ${ZT.X.unit(k, ZT.round1(s.inv[k] - cap))}`); s.inv[k] = cap; }
    }
    ZT.X.d(c, 'ON FOOT');
    ZT.State.log(s, `The station wagon is gone (${why}). You go on by foot.`, true);
    s.flags.lostVehicle = (s.flags.lostVehicle || 0) + 1;
  },
  gainVehicle(s, c, name) {
    s.vehicle = { has: true, engine: ZT.rint(s, 45, 75), tires: ZT.rint(s, 40, 75), electrical: ZT.rint(s, 45, 80), body: ZT.rint(s, 40, 80), broken: null, name: name || 'car' };
    ZT.X.d(c, `NEW VEHICLE: ${s.vehicle.name}`);
    ZT.State.log(s, `You have wheels again: a ${s.vehicle.name}.`, true);
  },
  /* delay: whole days pass as idle days; fractions slow tomorrow */
  delay(s, c, days) {
    const whole = Math.floor(days), frac = days - whole;
    for (let i = 0; i < whole; i++) ZT.Travel.idleDay(s);
    if (frac > 0) s.partialDelay = Math.min(0.9, s.partialDelay + frac);
    if (days > 0) ZT.X.d(c, days >= 1 ? `+${ZT.n(days)} ${ZT.plural(days, 'day')}` : 'half a day lost');
  },
  kill(s, c, m, cause) { if (!m || !m.alive) return; ZT.Party.kill(s, m, cause); ZT.X.d(c, `${m.name.toUpperCase()} DIED`); },
  missing(s, c, m) { if (!m || !m.alive) return; m.missing = true; ZT.X.d(c, `${m.name.toUpperCase()} MISSING`); ZT.State.log(s, `${m.name} is missing.`, true); },
  found(s, c, m) { if (!m || !m.alive || !m.missing) return; m.missing = false; ZT.X.d(c, `${m.name} is back`); ZT.State.log(s, `${m.name} came back.`, true); },
  shots(s, c, n) { const used = ZT.X.take(s, c, 'ammo', n); s.stats.shots += used; return used; },
  kills(s, n) { s.stats.kills += n; },
  flag(s, k, v) { s.flags[k] = v === undefined ? true : v; },
  log(s, text, notable) { ZT.State.log(s, text, notable); },
  /* pick a living member other than m */
  other(s, m) { const o = ZT.State.alive(s).filter((x) => x !== m); return o.length ? ZT.pick(s, o) : m; },
  /* random living member, prefer non-critical */
  someone(s) { const a = ZT.State.alive(s); return a.length ? ZT.pick(s, a) : (s.party[s.party.length - 1] || null); },
  /* role bonus helper: probability with role modifier */
  p(s, base, role, bonus) { return ZT.clamp(base + (role && ZT.State.hasRole(s, role) ? bonus : 0), 0.02, 0.98); },
  vehicleStatus(s) { return ZT.Vehicle.status(s); },
  /* generic loot from the region table. mult scales quantity. returns list of item keys.
     Deliberately mean: a good scavenge is a few days of food, never a resupply. */
  loot(s, c, mult, focus) {
    const reg = ZT.region(s);
    const diff = ZT.DIFF[s.difficulty];
    const found = [];
    const table = Object.assign({}, reg.loot);
    if (focus) table[focus] = (table[focus] || 1) * 4;
    const keys = Object.keys(table).filter((k) => table[k] > 0 && ZT.ITEMS[k]);
    if (!keys.length) return found;
    const total = keys.reduce((t, k) => t + table[k], 0);
    const picks = Math.max(1, Math.round((0.7 + ZT.rand(s) * 1.1) * mult));
    for (let i = 0; i < picks; i++) {
      let r = ZT.rand(s) * total, k = keys[0];
      for (const key of keys) { r -= table[key]; if (r <= 0) { k = key; break; } }
      const amt = ZT.X.lootAmount(s, k, mult * diff.salvage);
      if (amt > 0) { ZT.X.give(s, c, k, amt); found.push(k); }
    }
    if (ZT.roll(s, 0.18 * mult)) ZT.X.give(s, c, 'cash', ZT.rint(s, 4, 25));
    return found;
  },
  lootAmount(s, k, mult) {
    const base = { food: [10, 26], fuel: [1, 4], medicine: [1, 1], ammo: [4, 14], parts: [1, 1], tools: [1, 1], goods: [1, 2] }[k];
    if (!base) return 0;
    if (k === 'parts' || k === 'tools' || k === 'medicine') return ZT.roll(s, Math.min(0.7, 0.3 * mult)) ? 1 : 0;
    return Math.round(ZT.rint(s, base[0], base[1]) * mult);
  },
};

/* ===== 30_vehicle.js ===== */
/* ZOMBIE TRAILS — vehicle: wear, breakdowns, fuel */
'use strict';
ZT.Vehicle = {
  SUBS: ['engine', 'tires', 'electrical', 'body'],
  overall(s) {
    const v = s.vehicle;
    return 0.35 * v.engine + 0.25 * v.tires + 0.2 * v.electrical + 0.2 * v.body;
  },
  status(s) {
    if (!s.vehicle.has) return 'On foot';
    if (s.vehicle.broken) return 'Broken down';
    const o = ZT.Vehicle.overall(s);
    return o >= 75 ? 'Good' : o >= 50 ? 'Worn' : o >= 25 ? 'Poor' : 'Failing';
  },
  subStatus(v) { return v >= 75 ? 'good' : v >= 50 ? 'worn' : v >= 25 ? 'poor' : 'failing'; },
  speedFactor(s) {
    if (!s.vehicle.has) return 1;
    const o = ZT.Vehicle.overall(s);
    const tires = s.vehicle.tires < 30 ? 0.85 : 1;
    return (o >= 75 ? 1 : o >= 50 ? 0.95 : o >= 25 ? 0.85 : 0.7) * tires;
  },
  mpg(s) {
    const reg = ZT.region(s);
    const w = ZT.State.weight(s);
    let mpg = 18 * ZT.PACE[s.pace].fuelEff * reg.fuelEff;
    if (s.vehicle.engine < 50) mpg *= 0.85;
    if (s.vehicle.engine < 25) mpg *= 0.85;
    mpg *= 1 - Math.min(0.2, (w / 1500) * 0.15);
    if (s.weather === 'snow' || s.weather === 'storm') mpg *= 0.85;
    return mpg / ZT.Party.travelBonuses(s).fuel;
  },
  /* miles you could still drive on the fuel you have */
  range(s) { return s.vehicle.has ? s.inv.fuel * ZT.Vehicle.mpg(s) : 0; },
  dailyWear(s, milesToday) {
    if (!s.vehicle.has || milesToday <= 0) return;
    const reg = ZT.region(s);
    const diff = ZT.DIFF[s.difficulty];
    const wx = ZT.WEATHER[s.weather];
    const load = 1 + Math.min(0.3, (ZT.State.weight(s) / 1500) * 0.3);
    let total = 2.0 * ZT.PACE[s.pace].wear * diff.wear * reg.wear * wx.wear * load * (milesToday / ZT.PACE[s.pace].mpd);
    const split = { engine: 0.35, tires: 0.30, electrical: 0.15, body: 0.20 };
    if (reg.terrain === 'mountain') { split.engine = 0.45; split.tires = 0.3; split.electrical = 0.1; split.body = 0.15; }
    if (reg.terrain === 'highway') { split.tires = 0.38; split.body = 0.25; split.engine = 0.25; split.electrical = 0.12; }
    if (s.weather === 'rain' || s.weather === 'storm') { split.electrical += 0.15; split.engine -= 0.1; split.body -= 0.05; }
    for (const k of ZT.Vehicle.SUBS) {
      const amt = total * split[k] * (0.6 + ZT.rand(s) * 0.8);
      s.vehicle[k] = ZT.clamp(s.vehicle[k] - amt, 0, 100);
    }
  },
  breakdownChance(s) {
    if (!s.vehicle.has || s.vehicle.broken) return 0;
    const diff = ZT.DIFF[s.difficulty];
    let p = 0.008;
    for (const k of ZT.Vehicle.SUBS) {
      const v = s.vehicle[k];
      if (v < 60) p += Math.pow((60 - v) / 60, 2) * 0.11;
    }
    p *= ZT.PACE[s.pace].accident * (0.7 + 0.3 * diff.wear);
    if (ZT.region(s).terrain === 'mountain') p *= 1.4;
    if (ZT.State.hasRole(s, 'mechanic')) p *= 0.85;
    return ZT.clamp(p, 0, 0.35);
  },
  /* choose the subsystem that fails: weighted toward the worst */
  pickFailing(s) {
    let best = null, bestW = -1;
    for (const k of ZT.Vehicle.SUBS) {
      const w = (100 - s.vehicle[k]) * (0.5 + ZT.rand(s));
      if (w > bestW) { bestW = w; best = k; }
    }
    return best;
  },
  /* repair with parts: always works, costs a set and time */
  repairWithParts(s, c, sub) {
    if (s.inv.parts <= 0) return 'No spare parts.';
    if (sub === 'tires') c.animation = 'tire_change';
    ZT.X.take(s, c, 'parts', 1);
    s.vehicle[sub] = ZT.clamp(s.vehicle[sub] + 45, 0, 100);
    s.vehicle.broken = null;
    const mech = ZT.State.hasRole(s, 'mechanic');
    ZT.X.delay(s, c, mech ? 0.5 : 1);
    ZT.X.d(c, `${sub} +45`);
    return `The ${sub === 'tires' ? 'tire' : sub} is ${sub === 'tires' ? 'changed' : 'fixed'} with the spare parts${mech ? ' in a few hours' : ' after a long day'}.`;
  },
  /* jury-rig without parts: chance-based */
  juryRig(s, c, sub) {
    const mechM = ZT.State.byRole(s, 'mechanic');
    const mech = !!mechM;
    const mechName = mech ? mechM.name : '';
    const tools = s.inv.tools > 0;
    const p = ZT.clamp(0.4 + (mech ? 0.25 : 0) + (tools ? 0.15 : 0) - (s.vehicle[sub] < 15 ? 0.15 : 0), 0.1, 0.9);
    ZT.X.delay(s, c, 1);   // a day passes here, and the mechanic may not survive it
    ZT.X.noise(s, c, 5);
    if (ZT.roll(s, p)) {
      s.vehicle[sub] = ZT.clamp(s.vehicle[sub] + 18, 0, 100);
      s.vehicle.broken = null;
      ZT.X.d(c, `${sub} +18`);
      return `${mech && mechM.alive ? mechName + ' coaxes' : 'Everyone argues over the manual and somehow coaxes'} the ${sub === 'tires' ? 'tire' : sub} back into service. It will not last forever.`;
    }
    s.vehicle[sub] = ZT.clamp(s.vehicle[sub] - 4, 0, 100);
    return `A day of ${tools ? 'skinned knuckles' : 'improvising with a butter knife'} and the ${sub === 'tires' ? 'tire' : sub} is no better. Possibly worse.`;
  },
  /* maintenance day at the travel menu: uses a part on the worst subsystem */
  service(s, c) {
    if (!s.vehicle.has) return 'There is no vehicle to service.';
    if (s.inv.parts <= 0) return 'No spare parts to fit.';
    let worst = 'engine';
    for (const k of ZT.Vehicle.SUBS) if (s.vehicle[k] < s.vehicle[worst]) worst = k;
    ZT.X.take(s, c, 'parts', 1);
    s.vehicle[worst] = ZT.clamp(s.vehicle[worst] + 40, 0, 100);
    ZT.X.delay(s, c, ZT.State.hasRole(s, 'mechanic') ? 0.5 : 1);
    ZT.X.d(c, `${worst} +40`);
    return `A set of parts goes into the ${worst}. The wagon sounds a little less like it is dying.`;
  },
  describeBreakdown(s, sub) {
    return {
      engine: 'The engine coughs, knocks twice, and dies. The smell is not encouraging.',
      tires: 'A tire lets go with a bang that everyone assumes is a gunshot. It is not. It is worse: it is a tire.',
      electrical: 'The dash goes dark, the wipers stop mid-sweep, and the engine follows. Something electrical has given up.',
      body: 'The exhaust is dragging and a door will no longer close. The frame has taken one hit too many.',
    }[sub];
  },
};

/* ===== 40_travel.js ===== */
/* ZOMBIE TRAILS — travel engine: mileage, days, weather, zombie pressure, interrupts.
   Travel runs in chunks. step() advances one day and returns an interrupt or null. */
'use strict';
ZT.Travel = {
  /* ---------- weather ---------- */
  /* The journey leaves in September. Every week on the road tilts the weather
     table further into the cold half of the year — this is the clock. */
  seasonShift(s) { return ZT.clamp((s.day - 15) / 105, 0, 1.5); },
  rollWeather(s) {
    s.weatherDays--;
    if (s.weatherDays > 0) return;
    const base = ZT.region(s).weather;
    const w = ZT.Travel.seasonShift(s);
    const table = {};
    for (const k of Object.keys(base)) {
      let v = base[k];
      if (k === 'cold') v = v * (1 + w * 1.6) + w * 1.4;
      else if (k === 'snow') v = v * (1 + w * 2.0) + w * 0.7;
      else if (k === 'storm') v = v * (1 + w * 0.5);
      else if (k === 'heat') v = v * Math.max(0, 1 - w);
      else if (k === 'clear') v = v * Math.max(0.35, 1 - w * 0.35);
      table[k] = v;
    }
    const keys = Object.keys(table).filter((k) => table[k] > 0);
    const total = keys.reduce((t, k) => t + table[k], 0);
    let r = ZT.rand(s) * total, pickKey = keys[0];
    for (const k of keys) { r -= table[k]; if (r <= 0) { pickKey = k; break; } }
    const changed = pickKey !== s.weather;
    s.weather = pickKey;
    s.weatherDays = ZT.rint(s, 1, 4);
    return changed;
  },

  /* ---------- noise and horde ---------- */
  pressureTick(s, mode) {
    const diff = ZT.DIFF[s.difficulty];
    // noise decays
    s.zombie.noise = ZT.clamp(s.zombie.noise - (mode === 'travel' ? 8 + ZT.Party.travelBonuses(s).noise : 12), 0, 100);
    // horde pressure creeps up with distance and days
    const target = 5 + ZT.progress(s) * 55 * diff.horde;
    const drift = s.zombie.horde < target ? 0.7 : -0.4;
    s.zombie.horde = ZT.clamp(s.zombie.horde + drift + (s.zombie.noise > 55 ? 0.8 : 0), 0, 100);
  },
  /* 0..1 — how likely and how bad zombie contact is right now */
  threat(s) {
    const reg = ZT.region(s);
    const wx = ZT.WEATHER[s.weather];
    const dens = reg.density;
    const noise = s.zombie.noise / 100;
    const horde = s.zombie.horde / 100;
    const scout = ZT.State.hasRole(s, 'scout') ? 0.9 : 1;
    const vis = wx.vis;
    return ZT.clamp((dens * 0.55 + noise * 0.3 + horde * 0.35) * (1.25 - vis * 0.25) * scout, 0, 1.4);
  },
  threatWord(s) {
    const t = ZT.Travel.threat(s);
    return t < 0.25 ? 'Quiet' : t < 0.45 ? 'Restless' : t < 0.65 ? 'Active' : t < 0.9 ? 'Dangerous' : 'Overrun';
  },

  /* ---------- daily mileage ---------- */
  expectedMiles(s) {
    if (!s.vehicle.has) {
      let m = 12 * ZT.WEATHER[s.weather].speed;
      m *= 0.85 + (ZT.Party.avgHealth(s) / 100) * 0.3;
      m *= ZT.clamp(1 - ZT.Party.avgFatigue(s) / 250, 0.6, 1);
      return Math.max(3, m * ZT.Party.travelBonuses(s).mileage);
    }
    const pace = ZT.PACE[s.pace];
    const reg = ZT.region(s);
    const wx = ZT.WEATHER[s.weather];
    let m = pace.mpd * wx.speed * reg.road * ZT.Vehicle.speedFactor(s);
    if (ZT.State.hasRole(s, 'driver')) m *= 1.08;
    const fat = ZT.Party.avgFatigue(s);
    if (fat > 60) m *= 1 - (fat - 60) / 200;
    const sick = ZT.State.alive(s).filter((x) => x.health < 40 || x.inf === 'symptomatic').length;
    m *= 1 - Math.min(0.3, sick * 0.08);
    m *= ZT.Party.travelBonuses(s).mileage;
    return Math.max(4, m);
  },
  milesToday(s) {
    const variation = s.vehicle.has ? 0.88 + ZT.rand(s) * 0.24 : 0.85 + ZT.rand(s) * 0.3;
    return Math.max(s.vehicle.has ? 4 : 3, ZT.Travel.expectedMiles(s) * variation);
  },

  /* ---------- a single idle day (delays, repairs, camping) ---------- */
  idleDay(s) {
    s.day++;
    ZT.Travel.rollWeather(s);
    ZT.Travel.pressureTick(s, 'idle');
    ZT.Party.dailyTick(s, 'idle');
  },
  restDay(s) {
    s.day++; s.stats.restDays++;
    ZT.Travel.rollWeather(s);
    ZT.Travel.pressureTick(s, 'rest');
    ZT.Party.dailyTick(s, 'rest');
  },

  /* ---------- one day of travel ----------
     Returns an interrupt object or null.
     { kind: 'event'|'arrive'|'fork'|'breakdown'|'death'|'over'|'stuck', ... } */
  step(s) {
    if (s.over) return { kind: 'over' };
    if (!ZT.State.aliveCount(s)) { ZT.Travel.endGame(s, 'party'); return { kind: 'over' }; }
    if (!s.legTo) return { kind: 'fork', node: ZT.NODES[s.at] };   // waiting on a route choice
    if (s.vehicle.broken) return { kind: 'stuck', reason: 'broken' };
    if (s.vehicle.has && s.inv.fuel <= 0) return { kind: 'stuck', reason: 'fuel' };

    const leg = ZT.currentLeg(s);
    if (!leg) return { kind: 'fork', node: ZT.NODES[s.at] };

    s.day++;
    s.stats.travelDays++;
    ZT.Travel.rollWeather(s);

    let miles = ZT.Travel.milesToday(s);
    if (s.partialDelay > 0) { miles *= 1 - s.partialDelay; s.partialDelay = 0; }
    const left = leg.miles - s.legMiles;
    let arriving = false;
    if (miles >= left) { miles = left; arriving = true; }

    // fuel
    if (s.vehicle.has) {
      const mpg = ZT.Vehicle.mpg(s);
      const need = miles / mpg;
      if (need > s.inv.fuel) {
        const canGo = s.inv.fuel * mpg;
        miles = canGo; s.inv.fuel = 0; arriving = false;
        ZT.Travel.advance(s, miles);
        ZT.Vehicle.dailyWear(s, miles);
        ZT.Travel.pressureTick(s, 'travel');
        ZT.Party.dailyTick(s, 'travel');
        ZT.State.log(s, 'The wagon coasts to a stop. The tank is dry.', true);
        const d = ZT.Travel.checkDeaths(s); if (d) return d;
        return { kind: 'stuck', reason: 'fuel' };
      }
      s.inv.fuel = ZT.round1(s.inv.fuel - need);
    }

    ZT.Travel.advance(s, miles);
    ZT.Vehicle.dailyWear(s, miles);
    ZT.X.noise(s, null, ZT.PACE[s.pace].noise);
    ZT.Travel.pressureTick(s, 'travel');
    ZT.Party.dailyTick(s, 'travel');

    const dead = ZT.Travel.checkDeaths(s);
    if (dead) return dead;
    if (!ZT.State.aliveCount(s)) { ZT.Travel.endGame(s, 'party'); return { kind: 'over' }; }

    // arrival at the next place on the road
    if (arriving) {
      const node = ZT.Travel.arrive(s, leg.to);
      if (s.over) return { kind: 'over' };
      return { kind: 'arrive', node };
    }

    if (ZT.roll(s, ZT.Vehicle.breakdownChance(s))) {
      const sub = ZT.Vehicle.pickFailing(s);
      ZT.X.breakdown(s, null, sub);
      ZT.State.log(s, `The ${sub} failed near ${ZT.NODES[leg.to].name}.`, true);
      return { kind: 'breakdown', sub };
    }

    const ev = ZT.Events.maybeFire(s, 'travel');
    if (ev) return { kind: 'event', event: ev };

    return null;
  },

  /* move along the current leg */
  advance(s, miles) {
    s.legMiles = Math.round((s.legMiles + miles) * 10) / 10;
    s.miles = Math.round((s.miles + miles) * 10) / 10;
  },

  /* step onto a node: record it, clear the leg, end the game if it is Boise */
  arrive(s, id) {
    const node = ZT.NODES[id];
    s.at = id;
    s.legTo = null;
    s.legMiles = 0;
    if (s.path[s.path.length - 1] !== id) s.path.push(id);
    s.seen[id] = true;
    if (id === ZT.END_NODE) { ZT.Travel.endGame(s, 'win'); return node; }
    ZT.State.log(s, `Reached ${node.name}, ${node.sub}. ${Math.round(s.miles)} miles from Omaha.`, true);
    return node;
  },

  /* commit to a road out of the current node */
  takeLeg(s, toId) {
    const leg = ZT.legBetween(s.at, toId);
    if (!leg) return false;
    s.legTo = toId;
    s.legMiles = 0;
    ZT.State.log(s, `Took ${leg.road} toward ${ZT.NODES[toId].name}.`);
    return true;
  },

  /* the choices out of the node the party is standing on */
  choicesHere(s) {
    if (s.legTo) return [];
    return ZT.legsFrom(s.at);
  },

  checkDeaths(s) {
    if (s.pendingDeaths.length) {
      const idx = s.pendingDeaths.shift();
      return { kind: 'death', member: s.party[idx] };
    }
    return null;
  },

  /* ---------- rest / scavenge wrappers that can also fire events ---------- */
  rest(s, days) {
    const out = { days: 0, interrupt: null };
    for (let i = 0; i < days; i++) {
      if (s.over) break;
      ZT.Travel.restDay(s);
      out.days++;
      const d = ZT.Travel.checkDeaths(s);
      if (d) { out.interrupt = d; break; }
      if (!ZT.State.aliveCount(s)) { ZT.Travel.endGame(s, 'party'); out.interrupt = { kind: 'over' }; break; }
      const ev = ZT.Events.maybeFire(s, 'camp');
      if (ev) { out.interrupt = { kind: 'event', event: ev }; break; }
    }
    return out;
  },

  /* ---------- end conditions ---------- */
  endGame(s, why) {
    if (s.over) return;
    const survivors = ZT.State.alive(s);
    s.over = { why, day: s.day, miles: Math.round(s.miles), survivors: survivors.map((m) => m.name) };
    s.over.score = ZT.Score.compute(s);
    if (why === 'win') ZT.State.log(s, `The Boise gate opens. ${survivors.length} of you walk in.`, true);
    else if (why === 'party') ZT.State.log(s, 'No one is left to go on.', true);
    else if (why === 'stranded') ZT.State.log(s, 'The road ends here. You cannot go any further.', true);
  },

  /* is the run unwinnable — used to offer the player a stark choice, never to auto-fail */
  isStranded(s) {
    if (s.over) return false;
    if (!ZT.State.aliveCount(s)) return true;
    if (s.vehicle.has && s.inv.fuel <= 0 && s.inv.cash < 20 && s.inv.goods <= 0) {
      // stranded only if scavenging is also hopeless — it never quite is, so no
      return false;
    }
    return false;
  },
};

/* ---------- scoring ---------- */
ZT.Score = {
  compute(s) {
    const diff = ZT.DIFF[s.difficulty];
    const rows = [];
    let total = 0;
    const survivors = ZT.State.alive(s);
    const reached = s.over && s.over.why === 'win';
    for (const m of survivors) {
      const cond = ZT.State.condition(m);
      const pts = cond === 'healthy' ? 400 : cond === 'worn' ? 320 : cond === 'weak' ? 240 : cond === 'ill' || cond === 'injured' ? 200 : 120;
      rows.push({ label: `${m.name} (${cond})`, pts });
      total += pts;
    }
    if (!survivors.length) rows.push({ label: 'No survivors', pts: 0 });
    const milePts = Math.round(ZT.progress(s) * 600);
    rows.push({ label: `${Math.round(s.miles)} miles from Omaha`, pts: milePts }); total += milePts;
    if (s.vehicle.has) {
      const vp = Math.round(ZT.Vehicle.overall(s) * 1.5);
      rows.push({ label: `Wagon (${ZT.Vehicle.status(s).toLowerCase()})`, pts: vp }); total += vp;
    }
    let supplyPts = 0;
    for (const k of ZT.ITEM_ORDER) supplyPts += Math.round((s.inv[k] / ZT.ITEMS[k].cap) * 40);
    supplyPts += Math.round(s.inv.cash / 25);
    rows.push({ label: 'Supplies and cash remaining', pts: supplyPts }); total += supplyPts;
    if (reached) {
      const speed = Math.max(0, 400 - Math.max(0, s.day - 50) * 6);
      rows.push({ label: `Arrived on day ${s.day}`, pts: speed }); total += speed;
      rows.push({ label: 'Reached Boise', pts: 1000 }); total += 1000;
    }
    const mult = diff.score;
    const final = Math.round(total * mult);
    return { rows, subtotal: total, mult, total: final, difficulty: diff.name };
  },
  rank(score) {
    if (score >= 4000) return 'CONVOY LEADER';
    if (score >= 3000) return 'TRAIL BOSS';
    if (score >= 2000) return 'ROAD CAPTAIN';
    if (score >= 1200) return 'DRIVER';
    if (score >= 600) return 'PASSENGER';
    return 'STATISTIC';
  },
};

/* ===== 50_events.js ===== */
/* ZOMBIE TRAILS — event engine.
   Events are data. The engine filters by region/state, weights, picks, and resolves choices.

   Event shape:
     id      unique string
     cat     'road'|'zombie'|'vehicle'|'health'|'weather'|'people'|'camp'|'rare'|'landmark'
     regions array of region ids, or '*'
     when    'travel'|'camp'|'any'  (default 'travel')
     weight  number (default 5)
     cond    (s) => bool
     once    true = fires at most once per game
     cool    days before it can repeat (default 20)
     art     renderer scene key
     text    string or (s,c) => string
     choices array of { text, hint, show(s), do(s,c) => string|{text,then} }
*/
'use strict';
ZT.Events = {
  all: [],
  byId: {},
  add(list) {
    for (const e of list) {
      e.cat = e.cat || 'road';
      e.regions = e.regions || '*';
      e.when = e.when || 'travel';
      e.weight = e.weight == null ? 5 : e.weight;
      e.cool = e.cool == null ? 20 : e.cool;
      if (ZT.Events.byId[e.id]) throw new Error('duplicate event id: ' + e.id);
      ZT.Events.byId[e.id] = e;
      ZT.Events.all.push(e);
    }
  },

  eligible(s, when, pool) {
    const reg = ZT.regionId(s);
    const out = [];
    for (const e of (pool || ZT.Events.all)) {
      if (e.cat === 'landmark') continue;
      if (e.when !== 'any' && e.when !== when) continue;
      if (e.regions !== '*' && e.regions.indexOf(reg) < 0) continue;
      if (e.once && s.once[e.id]) continue;
      const last = s.stats.eventsSeen[e.id];
      if (last && s.day - last < e.cool) continue;
      if (e.cond && !e.cond(s)) continue;
      out.push(e);
    }
    return out;
  },

  weightOf(s, e) {
    let w = e.weight;
    if (typeof w === 'function') w = w(s);
    // zombie events scale with threat; quiet events fade as threat rises
    const t = ZT.Travel.threat(s);
    if (e.cat === 'zombie') w *= 0.45 + t * 1.4;
    else if (e.cat === 'road' || e.cat === 'people') w *= 1.15 - t * 0.35;
    if (e.cat === 'vehicle' && s.vehicle.has) w *= 1 + (100 - ZT.Vehicle.overall(s)) / 90;
    if (e.cat === 'weather' && s.weather !== 'clear') w *= 1.8;
    if (s.recent.indexOf(e.id) >= 0) w *= 0.15;
    return Math.max(0.01, w);
  },

  choose(s, when, pool) {
    const list = ZT.Events.eligible(s, when, pool);
    if (!list.length) return null;
    let total = 0;
    const ws = list.map((e) => { const w = ZT.Events.weightOf(s, e); total += w; return w; });
    let r = ZT.rand(s) * total;
    for (let i = 0; i < list.length; i++) { r -= ws[i]; if (r <= 0) return list[i]; }
    return list[list.length - 1];
  },

  /* chance an event fires on a given day */
  fireChance(s, when) {
    if (when === 'camp') return 0.30;
    const t = ZT.Travel.threat(s);
    let p = 0.40 + t * 0.22;
    p *= ZT.PACE[s.pace].enc;
    if (s.day - s.lastEventDay <= 1) p *= 0.5;
    if (s.day - s.lastEventDay >= 5) p += 0.18;
    return ZT.clamp(p, 0.05, 0.85);
  },

  maybeFire(s, when) {
    const story = ZT.Story && ZT.Story.due(s, when);
    if (story) return ZT.Events.begin(s, story);
    if (!ZT.roll(s, ZT.Events.fireChance(s, when))) return null;
    const e = ZT.Events.choose(s, when);
    if (!e) return null;
    return ZT.Events.begin(s, e);
  },

  /* Prepare an event instance for the UI: resolves text, filters choices. */
  begin(s, e) {
    if (typeof e === 'string') e = ZT.Events.byId[e];
    if (!e) return null;
    s.stats.events++;
    s.stats.eventsSeen[e.id] = s.day;
    s.lastEventDay = s.day;
    if (e.once) s.once[e.id] = true;
    s.recent.unshift(e.id);
    if (s.recent.length > 12) s.recent.pop();
    const c = { d: [], ev: e };
    if (e.setup) e.setup(s, c);
    const text = typeof e.text === 'function' ? e.text(s, c) : e.text;
    const choices = (e.choices || []).filter((ch) => !ch.show || ch.show(s, c));
    const inst = {
      id: e.id, art: e.art || null, cat: e.cat, text,
      choices: choices.map((ch, i) => ({
        i, text: typeof ch.text === 'function' ? ch.text(s, c) : ch.text,
        hint: typeof ch.hint === 'function' ? ch.hint(s, c) : ch.hint || '',
      })),
      _choices: choices, _c: c, _e: e,
    };
    if (!inst.choices.length) inst.choices = [{ i: -1, text: 'Continue', hint: '' }];
    return inst;
  },

  /* Resolve a choice. Returns { text, deltas, next } where next is a chained event instance or null. */
  resolve(s, inst, index) {
    const c = inst._c;
    c.d = [];
    c.animation = null;
    let outText = '';
    let next = null;
    if (index >= 0 && inst._choices[index]) {
      const ch = inst._choices[index];
      s.stats.choices[inst.id + ':' + index] = (s.stats.choices[inst.id + ':' + index] || 0) + 1;
      const r = ch.do ? ch.do(s, c) : '';
      if (r && typeof r === 'object') {
        outText = r.text || '';
        if (r.then) next = ZT.Events.begin(s, r.then);
      } else outText = r || '';
    }
    if (inst._e.after) {
      const extra = inst._e.after(s, c, index);
      if (extra) outText += (outText ? ' ' : '') + extra;
    }
    const deaths = [];
    while (s.pendingDeaths.length) deaths.push(s.party[s.pendingDeaths.shift()]);
    if (!ZT.State.aliveCount(s) && !s.over) ZT.Travel.endGame(s, 'party');
    return { text: outText, deltas: c.d.slice(), next, deaths, animation: c.animation || null };
  },
};

/* ZOMBIE TRAILS — arrivals along the Omaha–Boise road.
   Real places. The four big set pieces are Fort Kearny, the second landmark
   (Chimney Rock or Cheyenne, depending on the fork), the Continental Divide
   (South Pass or Creston), and Fort Hall. The rest are shorter arrival beats. */
'use strict';
(function () {
const X = ZT.X;
const someone = (s) => X.someone(s);

/* node id → arrival event id */
ZT.NODE_EVENT = {
  kearney: 'nd_kearney',
  ogallala: 'nd_ogallala',
  chimney: 'nd_chimney',

  rawlins: 'nd_rawlins',

};

/* the standing description on each arrival screen */
ZT.NODE_TEXT = {
  omaha: 'OMAHA, NEBRASKA. The Missouri River at your back and the whole state of Nebraska in front of you. The word out of the west is that Boise held: a valley with one road in, a river, and a fence. Nobody has confirmed it. Thirteen hundred miles is a long way to go on a rumour.',
  kearney: 'FORT KEARNY. Mile 195. The Platte here is a mile wide and an inch deep, exactly as advertised, and the interstate runs beside it under a steel arch built to celebrate everyone who ever came this way.',
  ogallala: 'OGALLALA. Mile 355. The end of the old Texas cattle trail, and the place where the Platte splits in two. North Platte or South Platte. The road forks with the river.',
  chimney: 'CHIMNEY ROCK. Mile 475. Three hundred feet of clay and sandstone standing alone above the North Platte, visible for a full day\'s travel in either direction. Every diary that ever came up this valley mentions it.',
  cheyenne: 'CHEYENNE, WYOMING. Mile 515. Rail yards, a capitol dome, and an air base out on the plain west of town with a fence you can see from the interstate. Fifty thousand people lived here.',
  casper: 'CASPER, WYOMING. Mile 725. Refinery stacks on the river flats and the North Platte running through the middle of it. West of here the road leaves the river and follows the Sweetwater.',

               'Pines close in on both sides, cutting the sky down to a strip.'],
    suburb:   ['Rows of houses pass, curtains still drawn, mail still waiting.',
               'A shopping cart sits alone in an intersection, going nowhere in particular.',
               'Streetlights stand dark in daylight, waiting for a dusk that will not need them.',
               'A cul-de-sac sign points to a street nobody has reason to take.'],
  },
  line(s) {
    const alive = ZT.State.alive(s);
    if (!alive.length) return 'Nobody speaks.';
    const m = alive[Math.floor(s.day / 2) % alive.length];
    if (m.inf === 'symptomatic') return `${m.name} asks how much farther. Nobody gives a number.`;
    if (m.fatigue > 70) return `${m.name}: "I am not asleep. I am resting my eyes very thoroughly."`;
    if (s.day % 3 === 0) {
      const pool = this.ambient[ZT.region(s).terrain] || this.ambient.plains;
      return pool[Math.floor(s.day / 3) % pool.length];
    }
    return `${m.name}: "${this.trait(m)[2]}"`;
  },
  remember(s, text) {
    s.flags.roadMemories = s.flags.roadMemories || [];
    s.flags.roadMemories.push({ day: s.day, text });
    ZT.State.log(s, text, true);
    return text;
  },
  due(s, when) {
    if (when !== 'travel' || s.day - s.lastEventDay < 2) return null;
    const f = s.flags;
    let id = null;
    if (!f.redScarf && s.stats.travelDays >= 3) id = 'story_red_scarf';
    else if (f.redScarf && !f.redCamp && s.day >= f.redDay + 5 && s.miles >= f.redMile + 65) id = 'story_red_camp';
    else if (f.redCamp && !f.redEnd && s.day >= f.redCampDay + 6 && s.miles >= f.redCampMile + 90) id = 'story_red_return';
    return id && !s.once[id] ? id : null;
  },
  forecast(s) {
    const need = ZT.Party.foodNeed(s);
    const days = need ? Math.floor(s.inv.food / need) : 0;
    const lines = [`Food: about ${days} full days at these rations (${ZT.n(need)} lb/day).`];
    if (s.vehicle.has) lines.push(`Fuel: about ${Math.floor(ZT.Vehicle.range(s))} miles at this load and pace.`);
    let danger = 'No immediate crisis. Weather and encounters can change that.';
    if (s.vehicle.has && s.vehicle.broken) danger = `Wagon: repair the ${s.vehicle.broken} before driving.`;
    else if (days < 2) danger = 'Food first: scavenge soon. An unfed day damages health and morale.';
    else if (ZT.State.alive(s).some(m => m.inf === 'symptomatic' || m.inf === 'bitten')) danger = 'Infection: check the party and treat wounds while there is time.';
    else if (s.vehicle.has && ZT.Vehicle.range(s) < 30) danger = 'Fuel is low. Search before committing to a long road.';
    else if (ZT.Party.avgFatigue(s) > 65) danger = 'The party needs rest. Exhaustion slows travel and can cost health.';
    else if (ZT.Travel.threat(s) > 0.65) danger = 'The dead are active here. Noise makes encounters more likely.';
    lines.push(danger);
    return lines;
  },
  epilogue(s, m) {
    if (!m.alive) return `${m.name} ${this.trait(m)[1]}. You remember that as well as the way they died.`;
    if (m.missing) return `${m.name} is still missing. There is no grave to put a name on.`;
    if (s.over && s.over.why === 'win') return `${m.name} made it. At the gate, someone asks what they can do. "${ZT.cap(m.role)}," they say. A beginning.`;
    return `${m.name} was still with you when the journey ended. They ${this.trait(m)[1]}.`;
  },
};

/* ===== 70_scavenge.js ===== */
/* ZOMBIE TRAILS — SCAVENGE THE BLOCK.
   A short, crude, top-down salvage run. Greed is the danger.
   Engine-only: no DOM. The renderer draws world state; the UI feeds input. */
'use strict';
ZT.Scavenge = {
  W: 40, H: 18, TILE: 8,

  /* ---------- menu-driven mode (accessible alternative, and the abstract path) ---------- */
  menuOptions(s) {
    const reg = ZT.region(s);
    const t = ZT.Travel.threat(s);
    return [
      { id: 'quick', label: 'Quick sweep', hint: 'half a day, little noise', risk: 0.10 + t * 0.10, mult: 0.45, hours: 0.5, noise: 7 },
      { id: 'thorough', label: 'Work the whole block', hint: 'a day, more noise, more found', risk: 0.28 + t * 0.24, mult: 0.95, hours: 1.0, noise: 17 },
      { id: 'break', label: 'Break into the locked places', hint: 'loud; best odds of medicine and parts', risk: 0.44 + t * 0.32, mult: 1.35, hours: 1.2, noise: 30 },
    ];
  },
  /* Food and fuel are what a search is FOR, so they are found reliably and scaled
     by how much the region has of each. Everything else stays a lucky extra. */
  staples(s, c, opt, boost) {
    const reg = ZT.region(s);
    const diff = ZT.DIFF[s.difficulty];
    const found = [];
    const foodBase = { quick: 11, thorough: 28, break: 37 }[opt.id] || 11;
    const foodScale = 0.6 + (reg.loot.food || 0) * 0.14;
    const food = Math.round(ZT.rint(s, Math.round(foodBase * 0.5), Math.round(foodBase * 1.25)) * foodScale * boost * diff.salvage);
    if (food > 0 && ZT.X.give(s, c, 'food', food) > 0) found.push('food');
    const fuelBase = { quick: 1, thorough: 4, break: 6 }[opt.id] || 1;
    const fuelScale = (reg.loot.fuel || 0) * 0.3;
    const fuel = Math.round(ZT.rint(s, 0, fuelBase) * fuelScale * boost * diff.salvage);
    if (fuel > 0 && ZT.X.give(s, c, 'fuel', fuel) > 0) found.push('fuel');
    return found;
  },
  menuRun(s, optId) {
    const opt = ZT.Scavenge.menuOptions(s).find((o) => o.id === optId) || ZT.Scavenge.menuOptions(s)[0];
    const c = { d: [] };
    s.stats.scavenges++;
    ZT.X.delay(s, c, opt.hours);
    ZT.X.noise(s, c, opt.noise);
    ZT.X.fatigueAll(s, c, Math.round(opt.hours * 12));
    const tools = s.inv.tools > 0 ? 1.15 : 1;
    const scout = ZT.State.hasRole(s, 'scout') ? 1.15 : 1;
    const boost = tools * scout;
    const found = ZT.Scavenge.staples(s, c, opt, boost)
      .concat(ZT.X.loot(s, c, opt.mult * boost, opt.id === 'break' ? (ZT.roll(s, 0.5) ? 'medicine' : 'parts') : null));
    let text = ZT.Scavenge.flavor(s, opt, found);
    let risk = opt.risk / (ZT.State.hasRole(s, 'scout') ? 1.3 : 1);
    if (ZT.roll(s, risk)) {
      const m = ZT.X.someone(s);
      if (ZT.roll(s, 0.35)) { ZT.X.bite(s, c, m); text += ` It goes wrong on the way out. ${m.name} is bitten.`; }
      else { ZT.X.injure(s, c, m, ZT.rint(s, 10, 22)); ZT.X.noise(s, c, 8); text += ` It goes wrong on the way out and ${m.name} comes back hurt.`; }
    }
    const deaths = []; while (s.pendingDeaths.length) deaths.push(s.party[s.pendingDeaths.shift()]);
    return { text, deltas: c.d, deaths };
  },
  flavor(s, opt, found) {
    const reg = ZT.region(s);
    const names = { food: 'food', fuel: 'fuel', medicine: 'medicine', ammo: 'ammunition', parts: 'parts', tools: 'tools', goods: 'trade goods' };
    const uniq = [...new Set(found)].map((k) => names[k]);
    const place = ZT.pick(s, {
      suburb: ['a cul-de-sac of split-levels', 'a strip mall', 'a row of garages', 'a church and its parking lot'],
      highway: ['a truck stop', 'a line of stalled semis', 'a state maintenance yard'],
      river: ['a boat ramp and bait shop', 'a row of river cabins', 'a flooded caravan park'],
      farm: ['a farmstead and two outbuildings', 'a co-op feed store', 'a grain bin and machine shed'],
      industry: ['a loading dock', 'a warehouse office', 'a container yard'],
      plains: ['a section road and two silos', 'a ranch house and a windbreak', 'an abandoned motel', 'a rest area and a weigh station'],
      hills: ['a hunting cabin', 'a ranger station', 'a gravel pit office'],
      mountain: ['a chained-off summit station', 'a snow shed and a plow depot', 'a chalet with the door open'],
      desert: ['a service station and a diner', 'a row of self-storage units', 'a dead RV park', 'a highway maintenance yard'],
    }[reg.terrain] || ['a row of buildings']);
    const base = {
      quick: `Twenty minutes through ${place}, taking only what is in reach.`,
      thorough: `Most of a day working ${place} properly, room by room.`,
      break: `${ZT.cap(place)}, and every locked thing in it opened with a pry bar and a great deal of noise.`,
    }[opt.id];
    if (!uniq.length) return base + ' Nothing worth carrying back.';
    return base + ' ' + ZT.cap(ZT.list(uniq)) + '.';
  },

  /* ---------- arcade mode ---------- */
  init(s) {
    const W = ZT.Scavenge.W, H = ZT.Scavenge.H;
    const g = {
      s, w: W, h: H,
      grid: new Uint8Array(W * H), // 0 open, 1 wall/building, 2 car
      containers: [], zombies: [], carry: [], noise: 0, time: 0, limit: 75,
      px: 2.5, py: H - 2.5, pvx: 0, pvy: 0,
      exitX: 2.5, exitY: H - 2.5,
      capacity: 5, over: null, msg: '', msgT: 0, flash: 0,
      lastNoiseX: 0, lastNoiseY: 0, noiseT: 0,
      hurt: 0, searchT: 0, searchTarget: null, steps: 0,
    };
    const R = () => ZT.rand(s);
    const set = (x, y, v) => { if (x >= 0 && y >= 0 && x < W && y < H) g.grid[y * W + x] = v; };
    // border
    for (let x = 0; x < W; x++) { set(x, 0, 1); set(x, H - 1, 1); }
    for (let y = 0; y < H; y++) { set(0, y, 1); set(W - 1, y, 1); }
    // buildings
    const blocks = [];
    for (let i = 0; i < 9; i++) {
      const bw = 3 + Math.floor(R() * 6), bh = 3 + Math.floor(R() * 4);
      const bx = 2 + Math.floor(R() * (W - bw - 4)), by = 2 + Math.floor(R() * (H - bh - 4));
      let clash = false;
      for (const b of blocks) if (bx < b.x + b.w + 2 && bx + bw + 2 > b.x && by < b.y + b.h + 2 && by + bh + 2 > b.y) clash = true;
      if (clash) continue;
      if (bx < 7 && by > H - 8) continue; // keep the start clear
      blocks.push({ x: bx, y: by, w: bw, h: bh });
      for (let y = by; y < by + bh; y++) for (let x = bx; x < bx + bw; x++) set(x, y, 1);
      // doorway
      const side = Math.floor(R() * 4);
      if (side === 0) set(bx + Math.floor(bw / 2), by, 0);
      else if (side === 1) set(bx + Math.floor(bw / 2), by + bh - 1, 0);
      else if (side === 2) set(bx, by + Math.floor(bh / 2), 0);
      else set(bx + bw - 1, by + Math.floor(bh / 2), 0);
    }
    // cars
    for (let i = 0; i < 10; i++) {
      const x = 1 + Math.floor(R() * (W - 2)), y = 1 + Math.floor(R() * (H - 2));
      if (g.grid[y * W + x] === 0 && !(x < 6 && y > H - 5)) set(x, y, 2);
    }
    // containers: place in open tiles, some inside buildings
    const kinds = ['food', 'food', 'fuel', 'medicine', 'ammo', 'parts', 'tools', 'goods'];
    let tries = 0;
    while (g.containers.length < 9 && tries < 500) {
      tries++;
      const x = 1 + Math.floor(R() * (W - 2)), y = 1 + Math.floor(R() * (H - 2));
      if (g.grid[y * W + x] !== 0) continue;
      if (Math.abs(x - g.exitX) + Math.abs(y - g.exitY) < 6) continue;
      if (g.containers.some((k) => Math.abs(k.x - x) + Math.abs(k.y - y) < 4)) continue;
      const locked = R() < 0.4;
      const kind = kinds[Math.floor(R() * kinds.length)];
      g.containers.push({ x: x + 0.5, y: y + 0.5, kind, locked, open: false, empty: false });
    }
    // zombies
    const density = ZT.region(s).density + s.zombie.horde / 200;
    const count = ZT.clamp(Math.round(4 + density * 12), 4, 16);
    for (let i = 0; i < count; i++) {
      let x, y, t = 0;
      do { x = 1 + Math.floor(R() * (W - 2)); y = 1 + Math.floor(R() * (H - 2)); t++; }
      while (t < 60 && (g.grid[y * W + x] !== 0 || (Math.abs(x - g.exitX) + Math.abs(y - g.exitY) < 9)));
      g.zombies.push({ x: x + 0.5, y: y + 0.5, vx: 0, vy: 0, tx: x + 0.5, ty: y + 0.5, alert: 0, wob: ZT.rand(s) * 6.28 });
    }
    return g;
  },

  solid(g, x, y) {
    const xi = Math.floor(x), yi = Math.floor(y);
    if (xi < 0 || yi < 0 || xi >= g.w || yi >= g.h) return true;
    return g.grid[yi * g.w + xi] === 1;
  },
  blocked(g, x, y) {
    const xi = Math.floor(x), yi = Math.floor(y);
    if (xi < 0 || yi < 0 || xi >= g.w || yi >= g.h) return true;
    const v = g.grid[yi * g.w + xi];
    return v === 1 || v === 2;
  },

  addNoise(g, n, x, y) {
    g.noise = ZT.clamp(g.noise + n, 0, 100);
    g.lastNoiseX = x; g.lastNoiseY = y; g.noiseT = 3.5;
    for (const z of g.zombies) {
      const d = Math.hypot(z.x - x, z.y - y);
      const reach = 6 + n * 0.35;
      if (d < reach) { z.tx = x; z.ty = y; z.alert = Math.max(z.alert, 1.2 + n / 40); }
    }
  },

  say(g, msg) { g.msg = msg; g.msgT = 2.6; },

  /* input: {up,down,left,right,action} */
  step(g, dt, input) {
    if (g.over) return;
    dt = Math.min(dt, 0.05);
    g.time += dt;
    if (g.msgT > 0) g.msgT -= dt;
    if (g.noiseT > 0) g.noiseT -= dt;
    if (g.flash > 0) g.flash -= dt;
    if (g.hurt > 0) g.hurt -= dt;

    // movement — keys are on/off, a thumbstick is analog
    let dx = (input.right ? 1 : 0) - (input.left ? 1 : 0);
    let dy = (input.down ? 1 : 0) - (input.up ? 1 : 0);
    let mag = 1;
    if (input.vx || input.vy) {
      dx = input.vx; dy = input.vy;
      mag = ZT.clamp(Math.hypot(dx, dy), 0, 1);
    }
    const moving = (dx || dy) && mag > 0.08;
    if (moving) {
      const len = Math.hypot(dx, dy) || 1;
      dx /= len; dy /= len;
      const speed = 7.2 * mag;
      const nx = g.px + dx * speed * dt, ny = g.py + dy * speed * dt;
      const r = 0.32;
      if (!ZT.Scavenge.blocked(g, nx + Math.sign(dx) * r, g.py)) g.px = nx;
      if (!ZT.Scavenge.blocked(g, g.px, ny + Math.sign(dy) * r)) g.py = ny;
      g.steps += dt;
      // running makes noise; creeping makes much less
      ZT.Scavenge.addNoise(g, dt * 4.5 * mag * mag, g.px, g.py);
      g.searchT = 0; g.searchTarget = null;
    } else {
      g.noise = Math.max(0, g.noise - dt * 5.5);
    }

    // searching
    const near = g.containers.find((k) => !k.open && Math.hypot(k.x - g.px, k.y - g.py) < 1.1);
    if (input.action && near) {
      if (g.searchTarget !== near) { g.searchT = 0; g.searchTarget = near; }
      g.searchT += dt;
      ZT.Scavenge.addNoise(g, dt * (near.locked ? 26 : 9), g.px, g.py);
      const need = near.locked ? 2.2 : 1.1;
      if (g.searchT >= need) {
        near.open = true; g.searchT = 0; g.searchTarget = null;
        const s = g.s;
        if (ZT.roll(s, near.locked ? 0.9 : 0.68) && g.carry.length < g.capacity) {
          let amt = ZT.X.lootAmount(s, near.kind, (near.locked ? 1.5 : 1.0) * ZT.DIFF[s.difficulty].salvage);
          if (near.kind === 'food') amt = Math.round(amt * 2.4);
          if (near.kind === 'fuel') amt = Math.round(amt * 1.6);
          if (amt > 0) { g.carry.push({ kind: near.kind, amt }); ZT.Scavenge.say(g, `+ ${ZT.X.unit(near.kind, amt)}`); }
          else { near.empty = true; ZT.Scavenge.say(g, 'Empty.'); }
        } else if (g.carry.length >= g.capacity) { ZT.Scavenge.say(g, 'Hands full. Go back to the car.'); }
        else { near.empty = true; ZT.Scavenge.say(g, 'Empty.'); }
        if (near.locked) ZT.Scavenge.addNoise(g, 16, g.px, g.py);
      }
    } else if (!input.action) { g.searchT = 0; g.searchTarget = null; }

    // zombies
    for (const z of g.zombies) {
      z.alert = Math.max(0, z.alert - dt * 0.14);
      const dToP = Math.hypot(g.px - z.x, g.py - z.y);
      if (dToP < 4.5 && g.noise > 12) { z.tx = g.px; z.ty = g.py; z.alert = Math.max(z.alert, 1.4); }
      if (dToP < 1.9) { z.tx = g.px; z.ty = g.py; z.alert = Math.max(z.alert, 1.6); }
      const spd = z.alert > 0.4 ? 2.5 : 0.85;
      let tx = z.tx, ty = z.ty;
      if (z.alert <= 0.05 && Math.hypot(tx - z.x, ty - z.y) < 0.6) {
        z.wob += ZT.rand(g.s) * 2 - 1;
        z.tx = ZT.clamp(z.x + Math.cos(z.wob) * 4, 1, g.w - 2);
        z.ty = ZT.clamp(z.y + Math.sin(z.wob) * 4, 1, g.h - 2);
      }
      let vx = tx - z.x, vy = ty - z.y;
      const l = Math.hypot(vx, vy) || 1; vx /= l; vy /= l;
      // crude wall avoidance
      const nx2 = z.x + vx * spd * dt, ny2 = z.y + vy * spd * dt;
      if (!ZT.Scavenge.solid(g, nx2, z.y)) z.x = nx2; else z.tx = z.x + (ZT.rand(g.s) - 0.5) * 6;
      if (!ZT.Scavenge.solid(g, z.x, ny2)) z.y = ny2; else z.ty = z.y + (ZT.rand(g.s) - 0.5) * 6;
      // contact
      if (Math.hypot(z.x - g.px, z.y - g.py) < 0.55 && g.hurt <= 0) {
        g.hurt = 1.6; g.flash = 0.3;
        const s = g.s;
        if (g.carry.length && ZT.roll(s, 0.6)) { const lost = g.carry.pop(); ZT.Scavenge.say(g, `Dropped the ${lost.kind}!`); }
        else ZT.Scavenge.say(g, 'It has hold of you!');
        g.contact = (g.contact || 0) + 1;
        // shove it off

scenes.travel = function (c, s, t, opt) {
  const off = (opt.dist || 0);
  const horizon = 96;
  landscape(c, s, horizon - 9, off);
  // mid layer: poles
  poles(c, off * 0.6, horizon + 2);
  // A passing fence stays beyond the shoulder, never in the driving lane.
  for (let i = 0; i < 10; i++) {
    const x = ((i * 40 - off * 0.7) % 400 + 400) % 400 - 40;
    px(c, x, horizon - 4, 2, 10);
    line(c, x, horizon, x + 40, horizon);
  }
  // road
  road(c, horizon + 6, 46);
  // Actual next-stop signs pass on the far shoulder, clear of the driving lane.
  const leg = ZT.currentLeg(s);
  if (leg) {
    const signX = 360 - ((off * 0.72 + 120) % 560 + 560) % 560;
    destinationSign(c, Math.round(signX), horizon + 2, ZT.NODES[leg.to].name,
      Math.max(0, Math.ceil(leg.miles - s.legMiles)), t);
  }
  // the wagon (or walkers on foot)
  const bob = Math.round(Math.sin(off * 0.9) * (s.pace === 'hard' ? 1.2 : 0.6));
  if (s.vehicle.has) {
    c.save(); c.translate(119, horizon + 7 + bob); c.scale(2, 2);
    wagon(c, 0, 0, off, !!s.vehicle.broken, s); c.restore();
    // Tailpipe puffs stay behind the wagon. Engine trouble has a visible cue.
    for (let i = 0; i < 3; i++) {
      const p = (t * 7 + i * 4) % 12;
      grey(c, 116 - p * 2, horizon + 34 - p / 3, 3 + p / 2, 2, 'g25');
    }
    if (s.vehicle.engine < 35 || s.vehicle.broken === 'engine') smoke(c, 199, horizon + 13, t, 25);
  }
  else { c.save(); c.translate(106, 115); c.scale(2, 2); const n = ZT.State.aliveCount(s); for (let i = 0; i < n; i++) figure(c, i * 11, 0, off * 1.4 + i, false); c.restore(); }
  for (let i = 0; i < 13; i++) {
    const x = ((i * 29 - off * 1.4) % 377 + 377) % 377 - 25;
    line(c, x, 159, x + 2, 154); line(c, x + 2, 159, x + 6, 156);
  }
  weatherFX(c, s.weather, t, opt.reduce);
};

// Small integer-pixel wind cycles keep the old bitmap look without shimmering.
// Only display time is used: scenery must never advance the game's seeded RNG.
function windCloth(c, x, y, t, length) {
  for (let i = 0; i < length; i++) {
    const wave = Math.round(Math.sin(t * 1.8 - i * 0.55) * (i / length) * 3);

  }

  const label = name.toUpperCase(), w = Math.max(64, tw(label) + 12);

  disc(c,x,y,10); disc(c,x,y,6,PAPER); disc(c,x,y,2);
  for(let i=0;i<4;i++) {
    const a=i*Math.PI/2+turn;
    px(c,x+Math.round(Math.cos(a)*4),y+Math.round(Math.sin(a)*4),2,2);
  }
}
function repairScene(c, s, t, opt, hot) {
  // This is a cosmetic, one-shot sequence on a successful spare-tire choice.
  // Use scene age, not the game's animation clock, and never replay on a loop.
  const changing=!!(opt && opt.animation==='tire_change' && s.vehicle.has);
  const age=changing ? (opt.motion===false ? 8 : ZT.clamp(opt.elapsed == null ? t : opt.elapsed,0,8)) : 0;
  const done=changing && age>=8;
  if(changing) t=age;
  const rise=changing ? Math.min(1,age/1.6,Math.max(0,(8-age)/1)) : 0;
  const lift=Math.round(rise*6), wheelY=135-lift;
  landscape(c,s,83,0); ground(c,108,0);
  if(changing) {
    const label=age<1.6?'RAISE THE JACK':age<3.6?'REMOVE THE FLAT':age<5.4?'FIT THE SPARE':age<7?'TIGHTEN THE LUGS':age<8?'LOWER THE WAGON':'SPARE FITTED';
    plate(c,label,14,14);
  }
  if (hot) {
    c.fillStyle=PAPER;c.fillRect(239,66,71,23);
    rect(c,239,66,71,23); plate(c,'COLD DRINKS',243,70); plate(c,'1/4 MI',255,80); px(c,272,89,2,18);
  }
  grey(c,35,131,178,9,'g25');
  if (s.vehicle.has) {
    closeWagon(c,s,66,84-lift,3,false);
    // Keep the front tire on the shoulder as the jack raises the chassis.
    disc(c,171,wheelY,12,PAPER); spareWheel(c,171,135,0);
    disc(c,93,wheelY,12,PAPER); disc(c,93,wheelY,3);
    if(!changing || age<1.6) {
      // A visibly squashed tire, not an already completed repair, before choosing.
      shape(c,[[83,wheelY-5],[87,wheelY-9],[99,wheelY-9],[103,wheelY-4],[105,wheelY+8],[81,wheelY+8]],INK);
      disc(c,93,wheelY,5,PAPER);disc(c,93,wheelY,2);
    } else if(age<3.6) {
      const u=ZT.clamp((age-1.6)/1.5,0,1);
      spareWheel(c,93-65*u,wheelY+(140-wheelY)*u,-u*4);
    }
    if(changing && age>=3.6) {
      // The discarded flat stays beside the car instead of disappearing.
      shape(c,[[17,138],[22,134],[34,134],[39,138],[41,146],[15,146]],INK);
      c.fillStyle=PAPER; c.fillRect(24,138,8,4);
    }
    if(!changing || age<3.6) spareWheel(c,44,135,0);
    else if(age<5.4) {
      const u=ZT.clamp((age-3.6)/1.8,0,1);
      spareWheel(c,44+49*u,135+(wheelY-135)*u,u*4);
    } else spareWheel(c,93,wheelY,0);
    // Scissor jack expands and folds; the handle works only during lift/lowering.
    const jy=done?147:138-lift;
    line(c,107,jy,101,146);line(c,101,jy,107,146);
    line(c,99,147,111,147);line(c,100,jy,110,jy);
    const pump=changing && (age<1.6 || age>=7 && !done) ? Math.round(Math.sin(age*9)*3) : 0;
    line(c,108,143,122,142+pump);px(c,121,141+pump,3,3);
  }
  const n=ZT.State.aliveCount(s);
  if (n) {
    if(done) traveler(c,53,117,'stand',0,0);
    else {
      traveler(c,70,119,'repair',t,0);
      if(changing && age>=5.4 && age<7) {
        const a=Math.sin(age*10)*0.7;
        line(c,84,138,93,wheelY);
        line(c,93,wheelY,93+Math.cos(a)*9,wheelY+Math.sin(a)*9);
      }
    }
  }
  for (let i=1;i<n;i++) traveler(c,201+(i-1)*27,106+(i%2)*8,'drink',t,i);
  toolbox(c,139,143); line(c,173,152,188,146); px(c,185,145,5,2);
  // Heat is a restrained shimmer above the empty shoulder, away from faces and text.
  if (hot) for (let i=0;i<4;i++) { const x=16+i*55+Math.round(Math.sin(t*1.2+i)*3); px(c,x,101+(i%2)*4,11,1); }
  if (!hot) weatherFX(c,s.weather,t,opt&&opt.reduce);
}

/* ---------- the map ----------
   Real coordinates, equirectangular with a cosine correction at 41.5N. */
const MAPB = { west: -119.0, east: -94.5, south: 38.6, north: 46.4 };
const KX = Math.cos((41.5 * Math.PI) / 180);
let MS = 1, MOX = 0, MOY = 0;
function fitMap(x, y, w, h) {
  const dw = (MAPB.east - MAPB.west) * KX, dh = MAPB.north - MAPB.south;
  MS = Math.min(w / dw, h / dh);
  MOX = x + (w - dw * MS) / 2;
  MOY = y + (h - dh * MS) / 2;
}
function mx(lon) { return MOX + (lon - MAPB.west) * KX * MS; }
function my(lat) { return MOY + (MAPB.north - lat) * MS; }
function poly(c, pts, style) {
  for (let i = 0; i < pts.length - 1; i++) {
    const x1 = mx(pts[i][1]), y1 = my(pts[i][0]), x2 = mx(pts[i + 1][1]), y2 = my(pts[i + 1][0]);
    if (style === 'dot') dotline(c, x1, y1, x2, y2, 3);
    else if (style === 'dash') dotline(c, x1, y1, x2, y2, 2, 2);
    else line(c, x1, y1, x2, y2);
  }
}
function dotline(c, x1, y1, x2, y2, every, run) {
  c.fillStyle = INK;
  const d = Math.max(1, Math.round(Math.hypot(x2 - x1, y2 - y1)));
  for (let i = 0; i <= d; i++) {
    const t = i / d;
    if (run ? (i % (every + run)) < run : (i % every) === 0) c.fillRect(Math.round(x1 + (x2 - x1) * t), Math.round(y1 + (y2 - y1) * t), 1, 1);
  }
}
function thick(c, x1, y1, x2, y2) { line(c, x1, y1, x2, y2); line(c, x1, y1 + 1, x2, y2 + 1); }
function chevrons(c, r) {
  const x = mx(r.at[1]), y = my(r.at[0]);
  const step = (r.w * MS) / Math.max(1, r.n - 1);
  for (let i = 0; i < r.n; i++) {
    const cx = r.vertical ? x : x - (r.w * MS) / 2 + i * step;
    const cy = r.vertical ? y - (r.w * MS) / 2 + i * step * 1.6 : y - (i % 2) * 2;
    line(c, cx - 2, cy + 2, cx, cy - 1);
    line(c, cx, cy - 1, cx + 2, cy + 2);
  }
}

scenes.map = function (c, s, t, opt) {
  opt = opt || {};
  fitMap(3, 3, W - 6, H - 22);
  // states
  for (const st of ZT.GEO.states) {
    poly(c, st.pts, 'dot');
    const lx = mx(st.label[1]), ly = my(st.label[0]);
    if (lx > 2 && lx < W - tw(st.name) - 2) bmp(c, st.name, lx, ly, INK);
  }
  // rivers and water
  for (const rv of ZT.GEO.rivers) poly(c, rv.closed ? rv.pts : rv.pts, 'dash');
  for (const rv of ZT.GEO.rivers) if (rv.closed) {
    let minx = 1e9, maxx = -1e9, miny = 1e9, maxy = -1e9;
    for (const pt of rv.pts) { minx = Math.min(minx, mx(pt[1])); maxx = Math.max(maxx, mx(pt[1])); miny = Math.min(miny, my(pt[0])); maxy = Math.max(maxy, my(pt[0])); }
    grey(c, minx, miny, Math.max(1, maxx - minx), Math.max(1, maxy - miny), 'g25');
  }
  // mountains
  for (const r of ZT.GEO.ranges) chevrons(c, r);
  // route: legs not taken first, faint
  const path = (s && s.path) || [ZT.START_NODE];
  const travelled = {};
  for (let i = 0; i < path.length - 1; i++) travelled[path[i] + '>' + path[i + 1]] = true;
  for (const l of ZT.LEGS) {
    const a = ZT.NODES[l.from], b = ZT.NODES[l.to];
    const key = l.from + '>' + l.to;
    if (travelled[key]) continue;
    const live = s && s.legTo === l.to && s.at === l.from;
    dotline(c, mx(a.lon), my(a.lat), mx(b.lon), my(b.lat), live ? 2 : 4, live ? 2 : 1);
  }
  // travelled legs, solid and heavy
  for (let i = 0; i < path.length - 1; i++) {
    const a = ZT.NODES[path[i]], b = ZT.NODES[path[i + 1]];
    if (!a || !b) continue;
    thick(c, mx(a.lon), my(a.lat), mx(b.lon), my(b.lat));
  }
  // nodes
  for (const id of Object.keys(ZT.NODES)) {
    const n = ZT.NODES[id];
    const x = mx(n.lon), y = my(n.lat);
    const seen = s && s.seen && s.seen[id];
    const big = n.kind === 'landmark' || n.kind === 'start' || n.kind === 'end';
    if (seen) { c.fillStyle = INK; c.fillRect(x - (big ? 2 : 1), y - (big ? 2 : 1), big ? 5 : 3, big ? 5 : 3); }
    else { rect(c, x - (big ? 2 : 1), y - (big ? 2 : 1), big ? 5 : 3, big ? 5 : 3); }
    if (id === (opt.sel || '')) { rect(c, x - 5, y - 5, 11, 11); rect(c, x - 6, y - 6, 13, 13); }
  }
  // short labels for the places that matter, kept clear of the route line
  const labels = [
    ['omaha', 'OMAHA', 'r', -5, 2], ['kearney', 'FT KEARNY', 'c', 0, 7], ['chimney', 'CHIMNEY RK', 'c', -2, -10],
    ['cheyenne', 'CHEYENNE', 'c', -2, 7], ['divide_n', 'S. PASS', 'r', -5, -3], ['divide_s', 'CRESTON', 'c', 6, 7],
    ['forthall', 'FT HALL', 'c', 0, -10], ['boise', 'BOISE', 'r', -5, 4], ['ogden', 'OGDEN', 'l', 5, 0],
  ];
  for (const [id, label, al, dx, dy] of labels) {
    const n = ZT.NODES[id];
    plate(c, label, mx(n.lon) + dx, my(n.lat) + dy, al);
  }
  // you
  if (s && s.at) {
    const pos = ZT.position(s);
    const x = mx(pos.lon), y = my(pos.lat);
    const blink = opt.reduce ? true : Math.sin(t * 4) > -0.4;
    if (blink) {
      c.fillStyle = PAPER; c.fillRect(x - 5, y - 6, 11, 13);
      c.fillStyle = INK;
      c.fillRect(x - 1, y - 5, 3, 3); c.fillRect(x - 2, y - 3, 5, 1);   // a little wagon-shaped marker
      c.fillRect(x - 4, y - 2, 9, 2); c.fillRect(x - 3, y, 2, 2); c.fillRect(x + 2, y, 2, 2);
      rect(c, x - 5, y - 6, 11, 13);
      plate(c, 'YOU', x + 8, y - 3, 'l');
    }
  }
  // frame, compass and scale
  rect(c, 0, 0, W, H - 18);
  const cx = W - 22, cy = 14;
  bmp(c, 'N', cx - 1, cy - 12);
  line(c, cx, cy - 5, cx, cy + 6); line(c, cx, cy - 5, cx - 3, cy - 1); line(c, cx, cy - 5, cx + 3, cy - 1);
  line(c, cx - 5, cy + 1, cx + 5, cy + 1);
  const per100 = (100 / 69) * MS;
  const sx = 8, sy = H - 24;
  c.fillStyle = PAPER; c.fillRect(sx - 3, sy - 12, per100 * 2 + 8, 17);
  bmp(c, '0', sx - 1, sy - 11); bmp(c, '200 MI', sx + per100 * 2 - 12, sy - 11);
  line(c, sx, sy, sx + per100 * 2, sy); line(c, sx, sy - 3, sx, sy + 2);
  line(c, sx + per100, sy - 2, sx + per100, sy + 2); line(c, sx + per100 * 2, sy - 3, sx + per100 * 2, sy + 2);
  // key strip along the bottom
  c.fillStyle = PAPER; c.fillRect(0, H - 17, W, 17);
  px(c, 0, H - 18, W, 1);
  let kx = 4;
  const key = (label, draw) => { draw(kx, H - 10); bmp(c, label, kx + 12, H - 12); kx += 12 + tw(label) + 9; };
  key('DRIVEN', (x, y) => { thick(c, x, y, x + 8, y); });
  key('AHEAD', (x, y) => { dotline(c, x, y, x + 8, y, 3); });
  key('STOP', (x, y) => { rect(c, x + 2, y - 2, 5, 5); });
  key('PASSED', (x, y) => { c.fillStyle = INK; c.fillRect(x + 2, y - 2, 5, 5); });
  key('YOU', (x, y) => { c.fillStyle = INK; c.fillRect(x + 3, y - 3, 3, 3); c.fillRect(x + 2, y, 5, 1); c.fillRect(x + 1, y + 1, 7, 1); });
};

/* Road atlas. Pure read-only projections of the route graph and saved journey.
   Distances follow game roads; straight map segments join their real endpoints. */
'use strict';
ZT.Atlas = {
  width: 1120, height: 460,
  escape(text) { return String(text).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); },
  key(l) { return l.from + '>' + l.to; },

  // Shortest path to an arbitrary stop, not a difference of distances to Boise.
  route(from, to) {
    if (!ZT.NODES[from] || !ZT.NODES[to]) return null;
    const todo = [{ id: from, miles: 0, legs: [] }], done = new Set();
    while (todo.length) {
      todo.sort((a, b) => a.miles - b.miles);
      const next = todo.shift();
      if (next.id === to) return { miles: next.miles, legs: next.legs };
      if (done.has(next.id)) continue;
      done.add(next.id);
      for (const leg of ZT.legsFrom(next.id)) {
        if (!done.has(leg.to)) todo.push({ id: leg.to, miles: next.miles + leg.miles, legs: next.legs.concat(leg) });
      }
    }
    return null;
  },
  fromYou(s, id) {
    const live = ZT.currentLeg(s);
    const route = this.route(live ? live.to : s.at, id);
    if (!route) return null;
    return { miles: route.miles + (live ? Math.max(0, live.miles - s.legMiles) : 0),
      legs: live ? [live].concat(route.legs) : route.legs };
  },
  status(s, id) {
    if (id === s.at && !s.legTo) return 'here';
    if ((s.path || []).includes(id)) return 'passed';
    return this.fromYou(s, id) ? 'ahead' : 'off';
  },
  distanceText(s, id) {
    const status = this.status(s, id);
    if (status === 'here') return 'You are here';
    if (status === 'passed') return 'Traveled';
    if (status === 'off') return 'Other branch';
    return Math.round(this.fromYou(s, id).miles) + ' mi ahead';
  },
  roadStatus(s, l) {
    if (s.at === l.from && s.legTo === l.to) return 'current';
    const path = s.path || [];
    if (path.some((id, i) => id === l.from && path[i + 1] === l.to)) return 'traveled';
    return ZT.reachable(s.legTo || s.at, l.from) ? 'ahead' : 'off';
  },
  preview(s, selected, destination) {
    const approach = this.fromYou(s, selected);
    if (!approach) return [];
    const branch = destination && ZT.legBetween(selected, destination);
    if (!branch) return approach.legs;
    const onward = this.route(destination, ZT.END_NODE);
    return approach.legs.concat(branch, onward ? onward.legs : []);

  legEstimate(s, leg) {

    const remaining = s.at === leg.from && s.legTo === leg.to ? Math.max(0, leg.miles - s.legMiles) : leg.miles;
    // A shallow view changes only the location used by the existing MPG function.

  },
  camera(zoom, center) {

    const base = { west: -117.7, east: -94.7, south: 39.5, north: 45.0 };
    const dx = (base.east - base.west) / z, dy = (base.north - base.south) / z;
    const lon = z === 1 ? (base.west + base.east) / 2 : ZT.clamp(center.lon, base.west + dx / 2, base.east - dx / 2);
    const lat = z === 1 ? (base.south + base.north) / 2 : ZT.clamp(center.lat, base.south + dy / 2, base.north - dy / 2);

/* ===== 85_save_audio.js ===== */
/* ZOMBIE TRAILS — save slots, settings, memorials */
'use strict';
ZT.Save = (function () {
const KEY = 'zombietrails.v1';
function store() {
  try { const t = '__zt'; localStorage.setItem(t, '1'); localStorage.removeItem(t); return localStorage; } catch (e) { return null; }
}
let mem = {};
function get(k) { const ls = store(); try { return ls ? ls.getItem(k) : mem[k]; } catch (e) { return mem[k]; } }
function set(k, v) { const ls = store(); try { if (ls) ls.setItem(k, v); else mem[k] = v; } catch (e) { mem[k] = v; } }
function del(k) { const ls = store(); try { if (ls) ls.removeItem(k); else delete mem[k]; } catch (e) { delete mem[k]; } }

return {
  save(s, slot) {
    slot = slot || 1;
    try { set(KEY + '.slot' + slot, ZT.State.serialize(s)); set(KEY + '.last', String(slot)); return true; } catch (e) { return false; }
  },
  load(slot) {
    slot = slot || Number(get(KEY + '.last') || 1);
    const raw = get(KEY + '.slot' + slot);
    if (!raw) return null;
    try { return ZT.State.deserialize(raw); } catch (e) { return null; }
  },
  has(slot) { return !!get(KEY + '.slot' + (slot || Number(get(KEY + '.last') || 1))); },
  clear(slot) { del(KEY + '.slot' + (slot || 1)); },
  info(slot) {
    const raw = get(KEY + '.slot' + slot);
    if (!raw) return null;
    try { const s = JSON.parse(raw);
      return { day: s.day, miles: Math.round(s.miles), alive: s.party.filter((m) => m.alive).length, difficulty: (ZT.DIFF[s.difficulty] || {}).name || s.difficulty, over: !!s.over };
    } catch (e) { return null; }
  },
  settings() {
    try { return JSON.parse(get(KEY + '.settings') || '{}'); } catch (e) { return {}; }
  },
  saveSettings(o) { set(KEY + '.settings', JSON.stringify(o)); },
  /* memorials persist between runs — old markers on the road */
  memorials() { try { return JSON.parse(get(KEY + '.memorials') || '[]'); } catch (e) { return []; } },
  addMemorial(m) {
    const list = ZT.Save.memorials();
    list.unshift(m);
    set(KEY + '.memorials', JSON.stringify(list.slice(0, 30)));
  },
  scores() { try { return JSON.parse(get(KEY + '.scores') || '[]'); } catch (e) { return []; } },
  addScore(rec) {
    const list = ZT.Save.scores();
    list.push(rec);
    list.sort((a, b) => b.score - a.score);
    set(KEY + '.scores', JSON.stringify(list.slice(0, 10)));
    return list.slice(0, 10);
  },
};
})();

/* ===== 86_audio.js ===== */
/* ZOMBIE TRAILS — offline sound cabinet. No downloads or game RNG use.
   Voices use the audio clock; muting cancels even notes scheduled in the future. */
'use strict';
ZT.Audio = (function () {
let ctx = null, master = null, noiseBuffer = null;
let on = false, unlocked = false, visible = true, ambience = true, volume = 0.5;
let scene = { key: '', weather: 'clear', moving: false }, timer = null, beat = 0;
const voices = new Set();
function ac() {
  if (!on || !unlocked || !visible) return null;
  try {
    if (!ctx) {
      const A = window.AudioContext || window.webkitAudioContext;
      if (!A) return null;
      ctx = new A(); master = ctx.createGain();
      master.gain.value = volume; master.connect(ctx.destination);
    }
    if (ctx.state === 'suspended') ctx.resume().catch(() => {});
    return ctx;
  } catch (e) { return null; } // Audio failure must never prevent a choice.
}
function track(source, nodes, ambient) {
  const voice = { source, nodes, ambient };
  voices.add(voice);
  source.onended = () => {
    voices.delete(voice);
    nodes.forEach(n => { try { n.disconnect(); } catch (e) {} });
  };
}
function stopVoices(ambientOnly) {
  for (const v of [...voices]) {
    if (ambientOnly && !v.ambient) continue;
    try { v.source.stop(); } catch (e) {}
    v.nodes.forEach(n => { try { n.disconnect(); } catch (e) {} });
    voices.delete(v);
  }
}
function envelope(g, start, dur, vol) {
  g.gain.setValueAtTime(0.0001, start);
  g.gain.exponentialRampToValueAtTime(Math.max(0.0001, vol), start + Math.min(0.02, dur / 3));
  g.gain.exponentialRampToValueAtTime(0.0001, start + dur);
}
function tone(freq, dur, type = 'square', vol = 0.05, delay = 0, end = freq, ambient = false) {
  const c = ac(); if (!c || (ambient && !ambience)) return;
  try {
    const o = c.createOscillator(), g = c.createGain(), start = c.currentTime + delay;
    o.type = type; o.frequency.setValueAtTime(freq, start);
    o.frequency.exponentialRampToValueAtTime(Math.max(20, end), start + dur);
    envelope(g, start, dur, vol); o.connect(g); g.connect(master);
    track(o, [o, g], ambient); o.start(start); o.stop(start + dur + 0.02);
  } catch (e) {}
}
function hiss(dur, vol, cutoff = 900, delay = 0, ambient = false) {
  const c = ac(); if (!c || (ambient && !ambience)) return;
  try {
    if (!noiseBuffer) {
      noiseBuffer = c.createBuffer(1, c.sampleRate * 2, c.sampleRate);
      const data = noiseBuffer.getChannelData(0); let seed = 1979;
      for (let i = 0; i < data.length; i++) {
        seed = (Math.imul(seed, 1664525) + 1013904223) >>> 0;
        data[i] = seed / 2147483648 - 1;
      }

    const start = c.currentTime + delay;
    n.buffer = noiseBuffer; n.loop = true; f.type = 'lowpass'; f.frequency.value = cutoff;
    envelope(g, start, dur, vol); n.connect(f); f.connect(g); g.connect(master);
    track(n, [n, f, g], ambient); n.start(start); n.stop(start + dur + 0.02);
  } catch (e) {}
}
function seq(notes, type = 'square', vol = 0.05) {
  let delay = 0;
  for (const [f, d] of notes) { tone(f, d, type, vol, delay); delay += d * 0.9; }
}
function pulse() {
  if (!on || !visible || !ambience || !ac()) return;
  beat++;
  if (scene.moving) {
    tone(65, 1.1, 'triangle', 0.026, 0, 70, true);
    hiss(1.1, 0.019, 440, 0, true);
  }
  if (scene.weather === 'rain' || scene.weather === 'storm') {
    hiss(1.15, 0.045, 2600, 0, true);
    if (scene.weather === 'storm' && beat % 7 === 0) hiss(1.4, 0.10, 140, 0, true);
  } else if (['snow', 'cold', 'wind', 'dust'].includes(scene.weather)) {
    hiss(1.15, 0.038, 480, 0, true);
  }
  if (['camp', 'fire'].includes(scene.key)) {
    hiss(0.95, 0.028, 1200, 0, true);
    hiss(0.035, 0.07, 2400, 0.25, true);
    hiss(0.025, 0.04, 1800, 0.72, true);
  } else if (/^z|horde|bandits/.test(scene.key) && beat % 4 === 1) {
    tone(94, 0.9, 'sawtooth', 0.017, 0, 49, true);
    tone(71, 1.1, 'triangle', 0.022, 0.2, 43, true);
  } else if (scene.key === 'radio') {
    hiss(0.6, 0.027, 3200, 0, true);

}
function stopBed() { if (timer !== null) clearInterval(timer); timer = null; stopVoices(true); }
function startBed() {
  stopBed();

  beat = 0; pulse(); timer = setInterval(pulse, 1100);
}
const api = {
  unlock() { unlocked = true; ac(); startBed(); },
  setOn(v) {
    on = !!v;
    if (on) { ac(); startBed(); }
    else { stopBed(); stopVoices(false); }
  },
  isOn() { return on; },
  setVolume(v) {
    volume = Number.isFinite(Number(v)) ? Math.max(0, Math.min(1, Number(v))) : 0.5;
    if (master) master.gain.setValueAtTime(volume, ctx.currentTime);
  },
  setAmbience(v) { ambience = !!v; startBed(); },
  setVisible(v) {
    visible = !!v;
    if (visible) startBed(); else { stopBed(); stopVoices(false); }
  },
  setScene(next) {
    next = Object.assign({ key: '', weather: 'clear', moving: false }, next);
    if (next.key === scene.key && next.weather === scene.weather && next.moving === scene.moving) return;
    scene = next; startBed();
  },
  warn() { seq([[300, 0.09], [240, 0.13]]); },
  bad() { seq([[220, 0.1], [180, 0.12], [140, 0.2]]); },
  good() { seq([[520, 0.07], [660, 0.07], [880, 0.12]]); },
  find() { hiss(0.06, 0.035, 2200); seq([[700, 0.05], [900, 0.12]]); },
  death() { seq([[300, 0.18], [240, 0.2], [190, 0.24], [140, 0.5]], 'triangle'); },
  landmark() { seq([[440, 0.1], [550, 0.1], [660, 0.22]], 'triangle', 0.09); },
  breakdown() { tone(120, 0.5, 'sawtooth', 0.045, 0, 30); hiss(0.3, 0.08, 700, 0.15); },
  shot() { hiss(0.16, 0.13, 2100); tone(115, 0.13, 'triangle', 0.08, 0, 30); },
  win() { seq([[440, 0.12], [554, 0.12], [659, 0.12], [880, 0.36]], 'triangle', 0.1); },
  // Routine vehicle sounds belong to ambience, including cancellation mid-cue.
  engine() { tone(36, 0.55, 'sawtooth', 0.04, 0, 100, true); hiss(0.25, 0.045, 420, 0, true); },
  stop() { tone(100, 0.7, 'triangle', 0.05, 0, 28, true); hiss(0.4, 0.05, 1100, 0, true); },
  repair() { [0, 0.17, 0.34].forEach(d => { hiss(0.05, 0.08, 3000, d); tone(720, 0.045, 'square', 0.03, d, 420); }); },
  heal() { seq([[392, 0.10], [523, 0.13], [659, 0.18]], 'sine', 0.09); },
  fuel() { [0, 0.1, 0.2, 0.3].forEach(d => tone(190, 0.08, 'sine', 0.055, d, 100)); },
  trade() { seq([[1046, 0.07], [1318, 0.16]], 'triangle', 0.08); },
  encounter(art, cat, vehicle) {
    if (['station', 'diner', 'reststop', 'zrest', 'cold_drinks', 'ice_freezer', 'beer_tent'].includes(art) && vehicle) api.stop();
    else if (cat === 'zombie') { tone(120, 0.7, 'sawtooth', 0.035, 0, 48); }
    else if (cat === 'vehicle') api.breakdown();
    else if (art === 'radio') hiss(0.5, 0.05, 3000);
    else api.warn();
  },
};
return api;
})();

/* ===== 90_ui.js ===== */
/* ZOMBIE TRAILS — UI controller. Menus, keyboard and pointer, modal events. */
'use strict';
ZT.UI = (function () {
let S = null;                 // game state
let screen = 'title';
let ctxData = {};             // per-screen scratch
let raf = null, last = 0, tAnim = 0;
let sceneStarted = 0;
const motionQuery = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)');
let keyMap = {};              // key -> handler for the current screen
let settings = Object.assign({ sound: false, volume: 0.5, ambience: true, motion: true, flash: true, scale: 1, arcade: false, daily: true, theme: 'light' }, ZT.Save.settings());
let travelling = null;        // travel animation state
let scav = null;              // active minigame

const $ = (id) => document.getElementById(id);
const esc = (str) => String(str).replace(/[&<>"']/g, (m) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));

/* ---------------- shell ---------------- */
function el(html) { const d = document.createElement('div'); d.innerHTML = html.trim(); return d.firstElementChild; }

function statusLine() {
  if (!S) return '';
  const next = ZT.nextNode(S);
  const to = ZT.milesToNext(S);
  const leg = ZT.currentLeg(S);
  return `<div class="bar" role="status" aria-live="polite">
    <span><b>DAY</b> ${S.day}</span>
    <span><b>DATE</b> ${ZT.dateOf(S.day)}</span>
    <span><b>MILE</b> ${Math.round(S.miles)}</span>
    <span><b>${leg ? 'NEXT' : 'AT'}</b> ${esc(next.name)}${leg ? ` (${to} mi ${ZT.heading(S)})` : ''}</span>
    <span><b>BOISE</b> ${Math.round(ZT.milesToEnd(S))} mi</span>
    <span><b>WX</b> ${ZT.WEATHER[S.weather].name}</span>
    <span><b>ROAD</b> ${ZT.Travel.threatWord(S)}</span>
  </div>`;
}

function sceneHTML(alt) {
  return `<div class="scene"><canvas id="scene" width="960" height="480" role="img" aria-label="${esc(alt || 'Monochrome travel scene')}"></canvas></div>`;
}

function menuHTML(items, opts) {
  opts = opts || {};
  const rows = items.map((it, i) => {
    if (it.sep) return `<li class="sep">${esc(it.sep)}</li>`;
    const n = it.key != null ? it.key : (i + 1);
    const dis = it.disabled ? ' disabled' : '';
    return `<li><button class="cmd" data-i="${i}"${dis}>
      <span class="num">${esc(String(n))}</span>
      <span class="lbl">${esc(it.label)}</span>
      ${it.hint ? `<span class="hint">${esc(it.hint)}</span>` : ''}
    </button></li>`;
  }).join('');
  return `<ul class="menu${opts.compact ? ' compact' : ''}">${rows}</ul>`;
}

function bindMenu(root, items, onPick) {
  keyMap = {};
  const buttons = [...root.querySelectorAll('button.cmd')];
  buttons.forEach((b) => {
    const i = Number(b.dataset.i);
    b.addEventListener('click', () => { if (!items[i].disabled) onPick(i, items[i]); });
  });
  items.forEach((it, i) => {
    if (it.sep || it.disabled) return;
    const k = String(it.key != null ? it.key : (i + 1)).toLowerCase();
    keyMap[k] = () => onPick(i, it);
  });
  // arrow navigation
  let idx = -1;
  const focusable = buttons.filter((b) => !b.disabled);
  const move = (d) => {
    if (!focusable.length) return;
    idx = (idx + d + focusable.length) % focusable.length;
    focusable[idx].focus();
  };
  keyMap['arrowdown'] = () => move(1);
  keyMap['arrowup'] = () => move(-1);
  keyMap['s'] = keyMap['s'] || (() => move(1));
  keyMap['w'] = keyMap['w'] || (() => move(-1));
}

function render(html, alt) {
  sceneStarted = tAnim;
  if (screen !== 'travelling') travelling = null;
  const root = $('screen');
  root.innerHTML = html;
  const cv = $('scene');
  if (cv) fitCanvas(cv);
  syncSound(!!cv);
  return root;
}
function syncSound(hasScene) {
  ZT.Audio.setScene({ key: hasScene ? ctxData.art || '' : '', weather: hasScene && S ? S.weather : 'clear', moving: screen === 'travelling' && !!S && S.vehicle.has });
}
function sceneOptions(extra) {
  const motion = settings.motion && !(motionQuery && motionQuery.matches);
  return Object.assign({ elapsed: tAnim - sceneStarted, motion, reduce: !settings.flash || !motion, settled: screen === 'outcome', animation: screen === 'outcome' ? ctxData.animation : null, sel: ctxData.sel }, extra);
}

/* The scene is a band, not the page. Pick the largest whole-pixel scale that fits
   the column AND a share of the viewport height, so the commands stay on screen. */
function fitCanvas(cv) {
  const w = (cv.parentElement && cv.parentElement.clientWidth) || 640;
  const vh = window.innerHeight || 800;
  const share = screen === 'map' ? 0.56 : screen === 'scavenge' ? 0.5 : (TOUCH ? 0.38 : 0.44);
  const budget = Math.max(112, Math.min(vh * share, 470));
  // aspect is exactly 2:1, so the box is whichever of width or height budget binds
  const cssW = Math.max(200, Math.min(w, Math.round(budget * 2)));
  const scale = ZT.clamp(Math.round(cssW / ZT.R.W), 1, 6);   // backing store stays a whole multiple
  cv.width = ZT.R.W * scale;
  cv.height = ZT.R.H * scale;
  cv.style.width = cssW + 'px';
  cv.style.height = Math.round(cssW / 2) + 'px';
}

/* ---------------- loop ---------------- */
function loop(ts) {
  raf = requestAnimationFrame(loop);
  if (document.hidden) { last = ts; return; }
  const dt = Math.min(0.05, (ts - last) / 1000 || 0);
  last = ts; tAnim += dt;
  const cv = $('scene');
  if (screen === 'scavenge' && scav) {
    const carried = scav.carry.length, hurt = scav.hurt;
    ZT.Scavenge.step(scav, dt, input);
    if (scav.carry.length > carried) ZT.Audio.find();
    if (scav.hurt > hurt) ZT.Audio.bad();
    if (cv) ZT.R.drawScavenge(cv, scav, tAnim, sceneOptions());
    updateScavHud(scav);
    if (scav.over) { const o = scav.over; scav = null; finishScavenge(o); }
    return;
  }
  if (travelling && screen === 'travelling') {
    travelling.t += dt;
    travelling.dist += dt * (travelling.speed || 34);
    if (cv) ZT.R.draw(cv, 'travel', S, tAnim, sceneOptions({ dist: travelling.dist }));
    if (travelling.t >= travelling.dur) stepTravel();

const input = { up: false, down: false, left: false, right: false, action: false, vx: 0, vy: 0 };
const TOUCH = (() => { try { return window.matchMedia('(pointer: coarse)').matches; } catch (e) { return false; } })();
const STANDALONE = (() => { try { return window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true; } catch (e) { return false; } })();

let audioUnlocked = false;
function unlockAudio() {
  if (audioUnlocked) return;
  audioUnlocked = true;
  ZT.Audio.unlock();

function onKey(e) {
  const k = e.key.toLowerCase();
  if (screen === 'scavenge') {
    const dn = e.type === 'keydown';
    if (k === 'arrowup' || k === 'w') { input.up = dn; e.preventDefault(); }
    else if (k === 'arrowdown' || k === 's') { input.down = dn; e.preventDefault(); }
    else if (k === 'arrowleft' || k === 'a') { input.left = dn; e.preventDefault(); }
    else if (k === 'arrowright' || k === 'd') { input.right = dn; e.preventDefault(); }
    else if (k === ' ' || k === 'enter') { input.action = dn; e.preventDefault(); }
    else if (k === 'escape' && dn) { if (scav) { ZT.Scavenge.finish(scav, 'left'); } }
    return;
  }
  if (e.type !== 'keydown') return;
  if (e.target && /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) && k !== 'escape') return;
  // A held number or Enter must not dismiss a newly opened scene.
  if (e.repeat && !['arrowup', 'arrowdown'].includes(k)) { e.preventDefault(); return; }
  const h = keyMap[k];
  if (h) { e.preventDefault(); h(); }
}

function goInstructions() {

          <h2>The road</h2>

          <p>Most of the game is a menu. You choose to travel, and time passes, and things happen to you. When something happens you pick from a short list of bad options.</p>
        </section>

          <ul>
            <li>Running out of food, slowly, over weeks.</li>

          <p>The route forks three times: at Ogallala, at Green River, and at Fort Hall. The old emigrant roads are longer, emptier and harder on the wagon. The interstates are faster and run into cities. Neither is the right answer, and the map screen shows both.</p>

function applyScale() { document.documentElement.style.setProperty('--tscale', [0.92, 1, 1.14][settings.scale]); }
function applyFlash() { const tube = document.getElementById('tube'); if (tube) tube.classList.toggle('reduced', !settings.flash); }
function applyTheme() {
  ZT.Display.setTheme(settings.theme);

  for (const [token, value] of Object.entries({ ink: p.paper, 'ink-2': p.well, phos: p.ink, 'phos-dim': p.muted, 'phos-dimmer': p.dim, 'phos-faint': p.rule })) root.style.setProperty('--' + token, value);

        <label for="tr${i}">Travel trait<select id="tr${i}" aria-describedby="tt${i}">${Object.entries(ZT.TRAITS).map(([k, t]) => `<option value="${k}"${traits[i] === k ? ' selected' : ''}>${esc(t.name)}</option>`).join('')}</select><small id="tt${i}">${esc(ZT.TRAITS[traits[i]].tip)}</small></label>
      </div></fieldset>`).join('')}</div>
      <h2>Difficulty</h2>
      <div class="diffs" role="radiogroup" aria-label="Difficulty">
        ${Object.entries(ZT.DIFF).map(([k, d]) => `<button class="diff${k === diff ? ' on' : ''}" data-d="${k}" role="radio" aria-checked="${k === diff}">
          <b>${esc(d.name)}</b><span>${esc(d.blurb)}</span><span class="dim">$${d.cash} to spend</span></button>`).join('')}
      </div>
      ${menuHTML([{ label: 'Depart for the supply depot', hint: 'next' }, { label: 'Roll random names', hint: '' }, { label: 'Back', key: 'Esc' }])}
    </div>`);
  root.querySelectorAll('.diff').forEach((b) => b.addEventListener('click', () => {
    diff = b.dataset.d; capture();
    goSetup();
    root.querySelector(`.diff[data-d="${diff}"]`).focus();
  }));
  $('party-count').addEventListener('change', () => {
    const chosen = Number($('party-count').value);
    capture(); ctxData.count = chosen; goSetup(); $('party-count').focus();
  });
  ids.forEach((i) => {
    $('rl' + i).addEventListener('change', () => { $('rt' + i).textContent = ZT.ROLE_TIPS[$('rl' + i).value]; });

function shopTotal() { return ZT.ITEM_ORDER.reduce((t, k) => t + ctxData.cart[k] * ZT.ITEMS[k].price, 0); }
function drawShop() {
  const cart = ctxData.cart;
  const total = shopTotal();
  const left = S.inv.cash - total;
  const weight = ZT.ITEM_ORDER.reduce((t, k) => t + cart[k] * ZT.ITEMS[k].lbs, 0);
  const root = render(`

        <thead><tr><th scope="col">Item</th><th scope="col">Price</th><th scope="col" class="r">Qty</th><th scope="col"></th><th scope="col" class="r">Cost</th><th scope="col">Notes</th></tr></thead>
        <tbody>
        ${ZT.ITEM_ORDER.map((k, i) => {
          const it = ZT.ITEMS[k];

            <td class="qty">

            <td class="dim">${esc(it.tip)}</td>

        }).join('')}
        </tbody>
        <tfoot>
          <tr><th scope="row" colspan="4">Total</th><td class="r num">${ZT.money(total)}</td><td class="${left < 0 ? 'warn' : 'dim'}">${left < 0 ? 'You cannot afford this.' : ZT.money(left) + ' left over'}</td></tr>
          <tr><th scope="row" colspan="4">Load</th><td class="r num">${Math.round(weight)} lbs</td><td class="dim">${weight > 900 ? 'The wagon will drink fuel at this weight.' : 'The wagon rides well at this weight.'}</td></tr>
        </tfoot>
      </table>
      ${menuHTML([
        { label: 'Load up and go west', hint: left < 0 ? 'not enough money' : 'depart', disabled: left < 0 },

/* ---------------- travel screen ---------------- */
function goTravel() {
  travelling = null; scav = null;
  if (S.over) return goEnd();
  screen = 'travel'; ctxData.art = 'travel';
  const v = S.vehicle;
  const warnings = [];
  if (v.has && v.broken) warnings.push(`The ${v.broken} is broken. The wagon is not going anywhere until it is fixed.`);
  if (v.has && S.inv.fuel <= 0) warnings.push('The tank is empty.');
  if (S.inv.food <= 0) warnings.push('There is no food left.');
  else if (S.inv.food < ZT.Party.foodNeed(S) * 4) warnings.push('Food is nearly gone.');
  if (!v.has) warnings.push('You are on foot.');
  const infected = S.party.filter((m) => m.alive && (m.inf === 'bitten' || m.inf === 'symptomatic'));
  if (infected.length) warnings.push(`${ZT.list(infected.map((m) => m.name))} ${infected.length === 1 ? 'is' : 'are'} infected.`);

  const atNode = !S.legTo;
  const items = [
    { label: atNode ? 'Choose the road on' : 'Continue on the trail', hint: atNode ? roadsHint() : paceBlurb() },
    { label: 'Check supplies', hint: 'inventory and the wagon' },
    { label: 'Look at the map', hint: 'where you are' },
    { label: 'Change pace', hint: ZT.PACE[S.pace].name },
    { label: 'Change rations', hint: ZT.RATIONS[S.rations].name },
    { label: 'Rest', hint: 'recover; costs days and food' },
    { label: 'Scavenge', hint: 'search this area for supplies' },
    { label: 'Treat someone', hint: `${S.inv.medicine} ${ZT.plural(S.inv.medicine, 'kit')} of medicine`, disabled: false },
    { label: 'Work on the wagon', hint: v.has ? (v.broken ? 'it is broken' : `${ZT.Vehicle.status(S).toLowerCase()}`) : 'no wagon', disabled: !v.has },
    { label: 'Journal', hint: 'what has happened so far' },
    { label: 'Save and quit', hint: '', key: '0' },
    { label: 'Settings', hint: 'text, sound, and untimed controls', key: 'S' },
  ];
  const root = render(`
    ${statusLine()}
    ${sceneHTML(sceneAlt())}
    <div class="travel">
      <div class="left">
        <section class="road-note" aria-label="Before you travel">${ZT.Story.forecast(S).map(t => `<p>${esc(t)}</p>`).join('')}</section>
        <p class="road-note">${esc(ZT.Story.line(S))}</p>
        ${partyEffects()}
        ${warnings.length ? `<ul class="warnings" role="alert">${warnings.map((w) => `<li>${esc(w)}</li>`).join('')}</ul>` : ''}
        ${menuHTML(items, { compact: true })}
      </div>
      <div class="right">
        ${partyTable()}
        ${suppliesMini()}
      </div>
    </div>`);
  bindMenu(root, items, (i) => {
    if (i === 0) { if (!S.legTo) goFork(); else startTravel(); }
    else if (i === 1) goStatus();
    else if (i === 2) goMap();
    else if (i === 3) goPace();
    else if (i === 4) goRations();
    else if (i === 5) goRest();
    else if (i === 6) goScavengeMenu();
    else if (i === 7) goTreat();
    else if (i === 8) goRepair();
    else if (i === 9) goJournal();
    else if (i === 10) { ZT.Save.save(S); showModal('SAVED', 'The journey is written down. It will be here when you come back.', [{ label: 'Back to the road' }, { label: 'Quit to title' }], (k) => (k === 1 ? goTitle() : goTravel()), 'camp'); }
    else if (i === 11) goSettings();
  });
  ZT.Save.save(S);
}
function sceneAlt() {
  const leg = ZT.currentLeg(S);
  const where = leg ? `${leg.road}, heading for ${ZT.NODES[leg.to].name}` : `stopped at ${ZT.NODES[S.at].name}`;
  return `The wagon on ${where}. Day ${S.day}, mile ${Math.round(S.miles)}, weather ${ZT.WEATHER[S.weather].name.toLowerCase()}.`;
}
function paceBlurb() {
  if (!S.vehicle.has) return `on foot, about ${Math.round(ZT.Travel.expectedMiles(S))} miles a day`;
  if (S.vehicle.broken) return 'not until the wagon is fixed';
  if (S.inv.fuel <= 0) return 'no fuel';

  return `~${mpd} mi/day \u00b7 ${Math.round(ZT.Vehicle.range(S))} mi of fuel`;
}
function condClass(c) {
  return { healthy: 'ok', worn: 'ok', weak: 'mid', ill: 'mid', injured: 'mid', exposed: 'mid', infected: 'bad', critical: 'bad', dead: 'dead', missing: 'bad' }[c] || '';
}
function partyTable() {
  const rows = S.party.map((m) => {
    const c = ZT.State.condition(m);
    if (!m.alive) return `<tr class="dead"><th scope="row">${esc(m.name)}</th><td colspan="3">died day ${m.diedDay} &mdash; ${esc(m.cause)}</td></tr>`;

      <td class="dim small">${m.fatigue > 65 ? 'exhausted' : m.fatigue > 40 ? 'tired' : 'rested'}${m.morale < 30 ? ', low' : ''}${m.isolated ? ', isolated' : ''}</td>
    </tr>`;
  }).join('');
  return `<table class="party"><caption>The party</caption><tbody>${rows}</tbody></table>`;
}
function suppliesMini() {
  const inv = S.inv;
  const cells = ZT.ITEM_ORDER.map((k) => `<div><b>${ZT.n(inv[k])}</b><span>${esc(ZT.ITEMS[k].unit)} ${esc(ZT.ITEMS[k].name.toLowerCase())}</span></div>`).join('');
  return `<div class="supplies"><h3>Supplies</h3><div class="grid">${cells}
    <div><b>${ZT.money(inv.cash)}</b><span>cash</span></div>
    <div><b>${esc(ZT.Vehicle.status(S))}</b><span>wagon</span></div>
  </div></div>`;
}
function partyEffects() {
  return `<details class="party-effects"><summary>How the party affects travel</summary><ul class="plain">${ZT.State.alive(S).map(m => `<li><b>${esc(m.name)}:</b> ${esc(ZT.Party.contribution(S, m))}</li>`).join('')}</ul><p class="small dim">Group traits require health of at least 40, fatigue below 85, no fever, and no isolation. Shared bonuses cap at three contributing people per trait.</p></details>`;
}

/* ---------------- travel action ---------------- */
function startTravel() {
  if (!S.vehicle.has) { /* walking is allowed */ }
  else if (S.vehicle.broken) { showModal('THE WAGON IS BROKEN', ZT.Vehicle.describeBreakdown(S, S.vehicle.broken) + ' Nothing moves until it is dealt with.', [{ label: 'Work on it' }, { label: 'Back' }], (k) => (k === 0 ? goRepair() : goTravel()), 'hood'); return; }
  else if (S.inv.fuel <= 0) { showModal('NO FUEL', 'The tank is dry. You are not driving anywhere on nothing. There may be fuel in this area if somebody goes looking for it.', [{ label: 'Scavenge for fuel' }, { label: 'Back' }], (k) => (k === 0 ? goScavengeMenu() : goTravel()), 'fuel'); return; }
  screen = 'travelling';
  travelling = { t: 0, dur: 3, dist: 0, speed: S.vehicle.has ? ZT.PACE[S.pace].mpd * 1.2 : 14 };
  ctxData.art = 'travel';
  const root = render(`${statusLine()}${sceneHTML(sceneAlt())}
    <div class="travelling">
      <p class="ticker" id="ticker">${esc(travelFlavor())}</p>
      ${menuHTML([{ label: 'Stop and make camp', hint: 'end the day here', key: 'Esc' }], { compact: true })}
    </div>`);
  bindMenu(root, [{ label: 'Stop' }], () => { travelling = null; goTravel(); });
  keyMap['escape'] = () => { travelling = null; goTravel(); };
  if (S.vehicle.has) ZT.Audio.engine();
  stepTravel();
}
function travelFlavor() {
  const leg = ZT.currentLeg(S);
  const wx = ZT.WEATHER[S.weather].name.toLowerCase();
  const road = leg ? `${leg.road}, through ${ZT.region(S).name}` : ZT.NODES[S.at].name;
  return `${road}. ${ZT.cap(wx)}. ${ZT.PACE[S.pace].name} pace, ${ZT.RATIONS[S.rations].name.toLowerCase()} rations.`;
}
function stepTravel() {
  const before = { day: S.day, miles: S.miles, food: S.inv.food, fuel: S.inv.fuel };
  const r = ZT.Travel.step(S);
  syncSound(true);
  const tick = $('ticker');
  if (tick) tick.textContent = travelFlavor() + ` Day ${S.day}, mile ${Math.round(S.miles)}.`;
  if (!r) {
    if (settings.daily) { showTravelDay(before); return; }
    travelling.t = 0;
    travelling.dur = 3;
    // stop travelling on a status change worth surfacing
    const lowFood = S.inv.food <= 0, lowFuel = S.vehicle.has && S.inv.fuel < 2;
    if (lowFood || lowFuel) { travelling = null; goTravel(); }
    return;
  }
  travelling = null;
  if (r.kind === 'death') { goMemorial(r.member, () => goTravel()); return; }
  if (r.kind === 'over') { goEnd(); return; }
  if (r.kind === 'arrive') { goArrive(r.node); return; }
  if (r.kind === 'fork') { goFork(); return; }
  if (r.kind === 'breakdown') {
    ZT.Audio.breakdown();
    showModal('BREAKDOWN', ZT.Vehicle.describeBreakdown(S, r.sub), [{ label: 'See to it' }], () => goRepair(), 'hood');
    return;
  }
  if (r.kind === 'stuck') { goTravel(); return; }
  if (r.kind === 'event') { goEvent(r.event); return; }
  goTravel();
}

const DAY_HINTS = [
  'Take your time. The journey waits for your next choice.',
  'No rush. The road will still be there when you are ready.',
  'Nothing else is asking for you right now.',
  'The wagon can sit a while longer.',
];
function showTravelDay(before) {
  screen = 'day-summary'; ctxData.art = 'travel'; travelling = null;
  const items = [{ label: 'Continue another day', hint: 'leave when you are ready' }, { label: 'Stop and check the party', key: 'Esc' }];
  const root = render(`${statusLine()}${sceneHTML(sceneAlt())}<div class="event">
    <h2 class="mtitle">DAY ${S.day} ON THE ROAD</h2>
    <p>${ZT.n(S.miles - before.miles)} miles traveled. ${ZT.n(Math.max(0, before.food - S.inv.food))} lb of food used${S.vehicle.has ? `; ${ZT.n(Math.max(0, before.fuel - S.inv.fuel))} gallons of fuel used` : ''}.</p>
    <p class="road-note">${esc(ZT.Story.line(S))}</p>${partyEffects()}
    <p class="scene-hint">${DAY_HINTS[S.day % DAY_HINTS.length]}</p>${menuHTML(items)}</div>`);
  bindMenu(root, items, i => i === 0 ? startTravel() : goTravel());
  keyMap.escape = () => goTravel();
  ZT.Save.save(S);
}

/* ---------------- event modal ---------------- */
function goEvent(inst) {
  screen = 'event'; ctxData.art = inst.art || 'road';
  ZT.Audio.encounter(ctxData.art, inst.cat, S.vehicle.has);
  const items = inst.choices.map((ch) => ({ label: ch.text, hint: ch.hint }));
  const root = render(`
    ${statusLine()}
    ${sceneHTML('Event scene')}
    <div class="event">
      <div class="etext"><p>${esc(inst.text)}</p></div>
      ${menuHTML(items)}
    </div>`);
  bindMenu(root, items, (i) => {
    const shots = S.stats.shots;
    const out = ZT.Events.resolve(S, inst, inst.choices[i].i);
    if (S.stats.shots > shots) ZT.Audio.shot();
    showOutcome(inst, out);
  });
}
function showOutcome(inst, out) {
  screen = 'outcome';
  ctxData.animation = out.animation || null;
  ctxData.art = out.animation === 'tire_change' ? (inst.art === 'summer_flat' ? 'summer_flat' : 'tire') : inst.art || ctxData.art || 'road';
  const deltas = out.deltas.filter(Boolean);
  const items = [{ label: out.next ? 'And then' : 'Continue' }];
  const outcomeAlt = out.animation === 'tire_change' ? 'Changing the flat tire: raise the wagon, fit the spare, tighten the wheel, and lower the jack.'
    : out.animation === 'refuel' ? 'Refueling stop: back into the bay, recover fuel with a hand pump, stow the hose, and return to the wagon.' : 'Event outcome';
  const root = render(`
    ${statusLine()}
    ${sceneHTML(outcomeAlt)}
    <div class="event">
      <div class="etext"><p>${esc(out.text || 'Nothing comes of it.')}</p></div>
      ${deltas.length ? `<ul class="deltas">${deltas.map((d) => `<li>${esc(d)}</li>`).join('')}</ul>` : ''}
      ${menuHTML(items)}
    </div>`);
  bindMenu(root, items, () => {
    if (out.deaths && out.deaths.length) { goMemorial(out.deaths[0], () => (out.next ? goEvent(out.next) : afterEvent())); return; }
    if (out.next) goEvent(out.next); else afterEvent();
  });
  if (out.deaths && out.deaths.length) ZT.Audio.death();
  else if (deltas.some((d) => /BITTEN|DIED|FAILED|MISSING/.test(d))) ZT.Audio.bad();
  else if (deltas.some((d) => /^\+.*fuel/i.test(d))) ZT.Audio.fuel();
  else if (deltas.some((d) => /^\+.*(food|medicine|ammunition|parts|goods)/i.test(d))) ZT.Audio.find();
}
function afterEvent() {
  if (S.over) return goEnd();
  if (!ZT.State.aliveCount(S)) { ZT.Travel.endGame(S, 'party'); return goEnd(); }
  ZT.Save.save(S);
  goTravel();
}

/* generic modal with art */
function showModal(title, body, items, onPick, art) {

    ${S ? statusLine() : ''}

      <div class="etext"><p>${body}</p></div>

/* ---------------- arriving somewhere, and choosing a road ---------------- */
const NODE_ART = {
  omaha: 'lm_city', kearney: 'lm_arch', ogallala: 'lm_fork', chimney: 'lm_chimney',
  cheyenne: 'lm_city', casper: 'lm_refinery', rawlins: 'lm_town', divide_n: 'lm_pass',
  divide_s: 'lm_desert', granger: 'lm_town', montpelier: 'lm_lake', ogden: 'lm_city',
  forthall: 'lm_fort', arco: 'lm_lava', twinfalls: 'lm_canyon', mtnhome: 'lm_base', boise: 'safezone',
};
function goArrive(node) {
  const id = S.at;
  screen = 'arrive'; ctxData.art = NODE_ART[id] || 'lm_town';
  ZT.Audio.landmark();
  const evId = ZT.NODE_EVENT[id];
  const items = [
    { label: evId ? 'Look around' : 'Take the road on', hint: '' },
    { label: 'Choose the road on', hint: roadsHint() },
    { label: 'Rest here a day', hint: 'recover' },
    { label: 'Scavenge the area', hint: '' },
    { label: 'Open the map', hint: 'where you are' },
    { label: 'Check supplies', hint: '' },
  ];
  const root = render(`
    ${statusLine()}
    ${sceneHTML(node.name + ', ' + node.sub)}
    <div class="event landmark">
      <h2 class="mtitle">${esc(node.name.toUpperCase())} <span class="sub">${esc(node.sub)}</span></h2>
      <div class="etext"><p>${esc(ZT.NODE_TEXT[id] || '')}</p></div>
      ${menuHTML(items)}
    </div>`);
  bindMenu(root, items, (i) => {
    if (i === 0) { if (evId) goEvent(ZT.Events.begin(S, evId)); else goFork(); }
    else if (i === 1) goFork();
    else if (i === 2) { const r = ZT.Travel.rest(S, 1); ZT.Save.save(S); if (r.interrupt) handleInterrupt(r.interrupt, () => goArrive(node)); else goArrive(node); }
    else if (i === 3) goScavengeMenu(() => goArrive(node));
    else if (i === 4) goMap(() => goArrive(node));
    else goStatus(() => goArrive(node));
  });
  ZT.Save.save(S);
}
function roadsHint() {
  const legs = ZT.Travel.choicesHere(S);
  return legs.length > 1 ? `${legs.length} ways from here` : legs.length ? legs[0].road : '';
}

/* the fork: pick a road out of the node you are standing on */
function goFork() {
  if (S.over) return goEnd();
  const legs = ZT.Travel.choicesHere(S);
  if (!legs.length) { goTravel(); return; }
  if (legs.length === 1) { ZT.Travel.takeLeg(S, legs[0].to); ZT.Save.save(S); goTravel(); return; }
  screen = 'fork'; ctxData.art = 'lm_fork';
  const here = ZT.NODES[S.at];
  const items = legs.map((l) => {
    const to = ZT.NODES[l.to];
    const total = l.miles + ZT.distToEnd(l.to);
    return { label: `${l.road} — ${to.name}`, hint: `${l.miles} mi to ${to.name} \u00b7 ${total} mi to Boise`, l };
  });
  items.push({ label: 'Look at the map first', hint: 'compare the roads', map: true });
  const root = render(`
    ${statusLine()}
    ${sceneHTML('A fork in the road at ' + here.name)}
    <div class="event">
      <h2 class="mtitle">WHICH ROAD</h2>
      <div class="etext"><p>The atlas is open on the hood at ${esc(here.name)}, ${esc(here.sub)}. There is more than one way west from here and they are not the same kind of road.</p></div>
      <table class="kv routes">
        <thead><tr><th scope="col">Road</th><th scope="col">To</th><th scope="col" class="r">Leg</th><th scope="col" class="r">To Boise</th><th scope="col">What it is</th></tr></thead>
        <tbody>${legs.map((l) => {
          const to = ZT.NODES[l.to];
          return `<tr><th scope="row">${esc(l.road)}</th><td>${esc(to.name)}<span class="dim"> ${esc(to.sub)}</span></td>
            <td class="num">${l.miles}</td><td class="num">${l.miles + ZT.distToEnd(l.to)}</td>
            <td class="dim">${esc(ZT.LEG_NOTE[l.from + '>' + l.to] || ZT.REGIONS[l.region].name)}</td></tr>`;
        }).join('')}</tbody>
      </table>
      ${menuHTML(items)}
    </div>`);
  bindMenu(root, items, (i) => {
    if (items[i].map) return goMap(() => goFork());
    ZT.Travel.takeLeg(S, items[i].l.to);
    ZT.Save.save(S);
    goTravel();
  });
}

function handleInterrupt(r, back) {
  if (!r) return back();
  if (r.kind === 'death') return goMemorial(r.member, back);
  if (r.kind === 'over') return goEnd();
  if (r.kind === 'event') return goEvent(r.event);
  back();
}

/* ---------------- memorial ---------------- */
function goMemorial(m, next) {
  screen = 'memorial'; ctxData.art = 'memorial';
  ZT.Audio.death();
  const root = render(`
    ${sceneHTML('A grave marker beside the road')}
    <div class="memorial">
      <p class="mem-here">HERE LIES</p>
      <h1 class="mem-name">${esc(m.name.toUpperCase())}</h1>
      <p class="mem-meta">DAY ${m.diedDay} &mdash; MILE ${m.diedMile}<br>${esc(ZT.cap(m.cause))}</p>
      <label class="mem-label" for="epi">Words for the marker</label>
      <input id="epi" maxlength="46" placeholder="rest easy" aria-describedby="epihelp">
      <p id="epihelp" class="dim small">Left blank, the marker says only the name.</p>
      ${menuHTML([{ label: 'Set the marker and go on' }])}
    </div>`);
  bindMenu(root, [{ label: 'Go on' }], () => {
    const v = ($('epi') || {}).value || '';
    m.epitaph = v.trim().slice(0, 46);
    ZT.State.log(S, `${m.name} buried at mile ${m.diedMile}.${m.epitaph ? ' "' + m.epitaph + '"' : ''}`, true);
    ZT.Save.addMemorial({ name: m.name, day: m.diedDay, mile: m.diedMile, cause: m.cause, epitaph: m.epitaph });
    ZT.Save.save(S);
    if (!ZT.State.aliveCount(S)) { ZT.Travel.endGame(S, 'party'); return goEnd(); }
    // more deaths queued?
    const more = ZT.Travel.checkDeaths(S);
    if (more) return goMemorial(more.member, next);
    next();
  });
}

          ${v.has ? `<p class="dim">The wagon does about ${ZT.n(ZT.Vehicle.mpg(S))} miles to the gallon at this load and pace: about ${Math.round(ZT.Vehicle.range(S))} miles of fuel.</p>` : '<p class="dim">You are travelling on foot and carrying everything.</p>'}

            <tbody>
            ${S.party.map((m) => m.alive ? `<tr>
              <th scope="row">${esc(m.name)}</th><td>${esc(ZT.cap(m.role))}</td>

              <td class="dim small">${esc(memberNotes(m))}</td>

}
function memberNotes(m) {
  const n = ZT.Party.needs(m);
  const parts = [ZT.Story.trait(m)[1], ZT.Party.contribution(S, m)];

      <p class="scav-msg" id="scavmsg" role="status" aria-live="assertive">&nbsp;</p>
      <div class="scav-ui">
        <p class="dim">${TOUCH
          ? 'Put a thumb anywhere on the picture and drag: that is your stick, and how far you push it is how fast you move. Creeping is quiet; running is not. Hold <b>SEARCH</b> beside a container to go through it, and at the car to load up and leave.'
          : 'Move with the arrow keys or WASD. Hold <b>Space</b> beside a container to search it. Get back to the car and hold <b>Space</b> to leave. Running and breaking locks makes noise, and they come to noise.'}</p>
        <div class="pad" aria-hidden="false">
          <button class="p" data-k="up" aria-label="Move up">&#9650;</button>
          <div><button class="p" data-k="left" aria-label="Move left">&#9664;</button><button class="p" data-k="action" aria-label="Search or leave">SEARCH</button><button class="p" data-k="right" aria-label="Move right">&#9654;</button></div>
          <button class="p" data-k="down" aria-label="Move down">&#9660;</button>
          <button class="p wide" data-k="quit" aria-label="Leave now">LEAVE NOW</button>
        </div>
        <div class="touchpad">
          <div class="stickzone" id="stickzone">DRAG ON THE PICTURE TO MOVE</div>
          <div class="touchbtns">
            <button class="big" data-k="action" aria-label="Search, or load up and leave">SEARCH</button>
            <button class="big ghost" data-k="quit" aria-label="Leave now">LEAVE NOW</button>
          </div>
        </div>
      </div>
    </div>`);
  const press = (k, v) => { if (k === 'quit') { if (v && scav) ZT.Scavenge.finish(scav, 'left'); } else input[k] = v; };
  root.querySelectorAll('button.p, button.big').forEach((b) => {
    const k = b.dataset.k;
    const on = (e) => { e.preventDefault(); press(k, true); };
    const off = (e) => { e.preventDefault(); press(k, false); };
    b.addEventListener('pointerdown', on); b.addEventListener('pointerup', off);
    b.addEventListener('pointerleave', off); b.addEventListener('pointercancel', off);
  });

  /* the canvas is the stick: touch down anywhere, drag to steer */
  const cv = $('scene'), zone = $('stickzone');
  if (cv) {
    let id = null;
    const toBuf = (e) => {
      const r = cv.getBoundingClientRect();
      return { x: ((e.clientX - r.left) / r.width) * ZT.R.W, y: ((e.clientY - r.top) / r.height) * ZT.R.H - 11 };
    };
    const down = (e) => {
      if (id !== null || !scav) return;
      id = e.pointerId; cv.setPointerCapture(id);
      const p2 = toBuf(e);
      scav.stick = { ox: p2.x, oy: p2.y, dx: 0, dy: 0 };
      input.vx = input.vy = 0;
      if (zone) zone.classList.add('live');
      e.preventDefault();
    };
    const move = (e) => {
      if (e.pointerId !== id || !scav || !scav.stick) return;
      const p2 = toBuf(e);
      let dx = p2.x - scav.stick.ox, dy = p2.y - scav.stick.oy;
      const len = Math.hypot(dx, dy);
      const R = 16;                                  // full deflection at 16 buffer px
      const m = Math.min(1, len / R);
      if (len > 0.001) { dx /= len; dy /= len; } else { dx = dy = 0; }
      scav.stick.dx = dx * m; scav.stick.dy = dy * m;
      input.vx = dx * m; input.vy = dy * m;
      e.preventDefault();
    };
    const up = (e) => {
      if (e.pointerId !== id) return;
      id = null; input.vx = input.vy = 0;
      if (scav) scav.stick = null;
      if (zone) zone.classList.remove('live');
    };
    cv.addEventListener('pointerdown', down);
    cv.addEventListener('pointermove', move);
    cv.addEventListener('pointerup', up);
    cv.addEventListener('pointercancel', up);
  }
  keyMap = {};
}
function updateScavHud(g) {
  const n = $('hnoise'); if (!n) return;
  n.style.width = Math.round(g.noise) + '%';
  n.className = g.noise > 60 ? 'hot' : '';
  $('hnoisen').textContent = Math.round(g.noise);
  $('hcarry').textContent = g.carry.length + '/' + g.capacity;
  $('htime').textContent = Math.max(0, Math.ceil(g.limit - g.time));
  $('hfound').textContent = g.containers.filter((k) => k.open).length + '/' + g.containers.length;
  const m = $('scavmsg');
  if (m) { const want = g.msgT > 0 ? g.msg : '\u00a0'; if (m.textContent !== want) m.textContent = want; }
}
function finishScavenge(o) {
  ZT.Save.save(S);
  screen = 'outcome';
  showOutcome({ art: 'zsupply' }, { text: o.text, deltas: o.deltas, next: null, deaths: o.deaths });
}

/* ---------------- end ---------------- */
function goEnd() {
  screen = 'end';
  const won = S.over && S.over.why === 'win';
  ctxData.art = won ? 'safezone' : 'memorial';
  const sc = S.over.score || ZT.Score.compute(S);
  const rank = ZT.Score.rank(sc.total);
  if (!ctxData.scored) {
    ctxData.scored = true;
    ZT.Save.addScore({ score: sc.total, rank, difficulty: sc.difficulty, won, day: S.day, miles: Math.round(S.miles), names: ZT.State.alive(S).map((m) => m.name) });
    ZT.Save.save(S);
  }
  if (won) ZT.Audio.win(); else ZT.Audio.death();
  const survivors = ZT.State.alive(S);
  const dead = S.party.filter((m) => !m.alive);
  const notable = S.log.filter((l) => l.n).slice(-14);
  const root = render(`
    ${sceneHTML(won ? 'The Boise valley gate' : 'A grave marker')}
    <div class="doc end">
      <h1>${won ? 'YOU REACHED BOISE' : 'THE ROAD ENDS HERE'}</h1>
      <p class="lede">${esc(endBlurb(won, survivors))}</p>
      <div class="cols">
        <section>
          <h2>${won ? 'Who arrived' : 'Who was still with you'}</h2>
          ${survivors.length ? `<ul class="plain">${survivors.map((m) => `<li>${esc(m.name)}, ${esc(m.role)} &mdash; ${esc(ZT.State.condition(m))}</li>`).join('')}</ul>` : '<p class="dim">Nobody.</p>'}
          ${dead.length ? `<h2>Who did not</h2><ul class="plain">${dead.map((m) => `<li>${esc(m.name)} &mdash; day ${m.diedDay}, mile ${m.diedMile}, ${esc(m.cause)}${m.epitaph ? `. &ldquo;${esc(m.epitaph)}&rdquo;` : ''}</li>`).join('')}</ul>` : ''}
        </section>
        <section>
          <h2>Score</h2>
          <table class="kv score">
            ${sc.rows.map((r) => `<tr><th scope="row">${esc(r.label)}</th><td class="num">${r.pts}</td></tr>`).join('')}
            <tr class="tot"><th scope="row">Subtotal</th><td class="num">${sc.subtotal}</td></tr>
            <tr class="tot"><th scope="row">${esc(sc.difficulty)} multiplier</th><td class="num">&times;${sc.mult}</td></tr>
            <tr class="grand"><th scope="row">Final</th><td class="num">${sc.total}</td></tr>
          </table>
          <p class="rank">${esc(rank)}</p>
        </section>
        <section class="wide">
          <h2>The people you remember</h2>
          ${S.party.map(m => `<p>${esc(ZT.Story.epilogue(S, m))}</p>`).join('')}
          ${(S.flags.roadMemories || []).length ? `<h2>Choices that followed you</h2><ul class="plain">${S.flags.roadMemories.map(m => `<li>Day ${m.day}: ${esc(m.text)}</li>`).join('')}</ul>` : ''}
          <h2>What happened</h2>
          <ul class="log">${notable.map((l) => `<li class="notable"><span class="when">Day ${l.day} &middot; mi ${l.mile}</span> ${esc(l.text)}</li>`).join('')}</ul>
        </section>
      </div>
      ${menuHTML([{ label: 'Go again' }, { label: 'Read the whole journal' }, { label: 'Title screen' }])}
    </div>`);
  bindMenu(root, [{ label: 'Again' }, { label: 'Journal' }, { label: 'Title' }], (i) => {
    if (i === 0) { ZT.Save.clear(1); ctxData = {}; goSetup(); }
    else if (i === 1) { goJournalEnd(); }
    else { ZT.Save.clear(1); ctxData = {}; goTitle(); }
  });
}
function goJournalEnd() {
  screen = 'journal-end'; ctxData.art = 'map';
  const notable = S.log.slice().reverse();
  const root = render(`<div class="doc"><h1>THE WHOLE JOURNAL</h1>
    <ul class="log">${notable.map((l) => `<li${l.n ? ' class="notable"' : ''}><span class="when">Day ${l.day} &middot; mi ${l.mile}</span> ${esc(l.text)}</li>`).join('')}</ul>
    ${menuHTML([{ label: 'Back', key: 'Esc' }])}</div>`);
  bindMenu(root, [{ label: 'Back' }], () => { ctxData.scored = true; goEnd(); });
  keyMap['escape'] = () => { ctxData.scored = true; goEnd(); };
}
function endBlurb(won, survivors) {
  if (won) {
    if (survivors.length === S.party.length) return `${S.party.length} ${ZT.plural(S.party.length, 'person left', 'people left')} Omaha and everyone reached the Boise valley. That does not happen often.`;
    if (survivors.length === 1) return `${survivors[0].name} came the last of it alone, and the gate opened anyway.`;
    return `${ZT.list(survivors.map((m) => m.name))} reached Boise. The rest are somewhere between here and the Missouri River, marked.`;
  }
  return `The wagon got as far as ${esc(ZT.NODES[S.at].name)} — mile ${Math.round(S.miles)} — on day ${S.day}, with ${Math.round(ZT.milesToEnd(S))} miles of Idaho still to go. Somebody will find the atlas eventually and read the notes in the margins.`;
}

/* ---------------- boot ---------------- */
function start() {
  applyTheme();
  const themeButton = $('theme-toggle');
  if (themeButton) themeButton.addEventListener('click', toggleTheme);
  const soundButton = $('sound-toggle');
  if (soundButton) soundButton.addEventListener('click', () => toggleSound());
  updateSoundButton();
  applyScale();
  applyFlash();
  ZT.Audio.setVolume(settings.volume);
  ZT.Audio.setAmbience(settings.ambience);
  ZT.Audio.setVisible(!document.hidden);
  ZT.Audio.setOn(settings.sound);
  ZT.R.setScanlines(settings.flash);
  document.addEventListener('keydown', unlockAudio, { once: true, capture: true });
  document.addEventListener('keydown', onKey);
  document.addEventListener('keyup', onKey);
  document.addEventListener('pointerdown', unlockAudio, { once: true });
  document.addEventListener('visibilitychange', () => { ZT.Audio.setVisible(!document.hidden); last = performance.now(); });
  if (STANDALONE) document.documentElement.classList.add('installed');
  const refit = () => { const cv = $('scene'); if (cv) fitCanvas(cv); };
  window.addEventListener('resize', refit);
  window.addEventListener('orientationchange', () => setTimeout(refit, 120));
  window.addEventListener('beforeunload', () => { if (S && !S.over) ZT.Save.save(S); });
  goTitle();
  raf = requestAnimationFrame(loop);
}

return { start, get state() { return S; }, goTitle };
})();

ZT.UI.start();
</script>
</body>
